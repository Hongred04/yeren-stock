<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f4f6f9">
<title>野人体系</title>
<style>
:root{
  /* 设计令牌：工业实用 —— 暖纸底 + 等宽数字（与桌面端同一套） */
  --bg:#f2efe8; --card:#fdfbf6; --line:#ddd6c8; --line2:#eae4d8;
  --tx:#191713; --tx2:#5d574c; --tx3:#948c7d;
  --red:#c8242f; --red-bg:#fbeceb;
  --grn:#1c7b52; --grn-bg:#e9f4ee;
  --org:#b5791a; --org-bg:#faf1df;
  --blu:#2b5b8c; --blu-bg:#eaf0f6;
  --sk:#ece7db;
  --sh:0 1px 2px rgba(40,32,18,.06);
  --sh2:0 6px 20px rgba(40,32,18,.09);
  --r-sm:6px; --r-md:10px; --r-lg:16px;
  --ease:cubic-bezier(.16,1,.3,1);
  --mono:"JetBrains Mono","Cascadia Mono",Consolas,ui-monospace,monospace;
  --tabh:56px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141310; --card:#1e1c18; --line:#332f28; --line2:#282420;
    --tx:#f0ece3; --tx2:#a8a196; --tx3:#726b60;
    --red:#ff5f68; --red-bg:#3a1e20; --grn:#3bbf7f; --grn-bg:#15301f;
    --org:#e0a23c; --org-bg:#33280f; --blu:#6f9dd0; --blu-bg:#182534;
    --sk:#282420;
  }
  .hero.go{background:#15301f!important}
  .hero.hold{background:#33280f!important}
  .hero.stop{background:#3a1e20!important}
  .mode{background:var(--org-bg)!important;border-color:transparent!important}
  .tabbar{background:#1a1814!important}
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);
  font:15px/1.7 "PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;
  font-variant-numeric:tabular-nums;
  padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom))}
b,strong{font-weight:800}
.fl{color:var(--tx3)}.up{color:var(--red)}.dn{color:var(--grn)}

/* ── 顶栏 ── */
header{position:sticky;top:0;z-index:20;
  padding:calc(6px + env(safe-area-inset-top)) 12px 6px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line2);
  display:flex;align-items:center;gap:7px}
.brand{font-weight:900;font-size:14px;letter-spacing:.4px}
.hmeta{font-size:11px;color:var(--tx3);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#btnRefresh{margin-left:auto;border:1px solid var(--line);background:var(--card);
  color:var(--tx2);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:700;
  min-height:36px;display:flex;align-items:center;gap:3px;flex:none}
#btnRefresh:active{opacity:.6}
#btnRefresh.syncing{color:var(--blu);border-color:var(--blu)}

main{padding:8px 10px 7px;max-width:560px;margin:0 auto}
.tab{display:none}
.tab.on{display:block}
h2{font-size:12px;font-weight:800;color:var(--tx2);margin:12px 2px 5px;
  display:flex;align-items:baseline;gap:4px}
h2:first-child{margin-top:3px}
h2 .cnt{font-size:11px;font-weight:600;color:var(--tx3)}

/* ── 底部 Tab 栏 ── */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line2);
  padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;background:none;border:0;padding:4px 0 5px;color:var(--tx3);
  font-size:11px;font-weight:700;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:2px;min-height:var(--tabh)}
.tabbar button .ic{font-size:17px;line-height:1.15;filter:grayscale(1);opacity:.55}
.tabbar button.on{color:var(--blu)}
.tabbar button.on .ic{filter:none;opacity:1}
.tabbar .dot{position:absolute;transform:translate(15px,-2px);
  min-width:15px;height:15px;border-radius:8px;background:var(--red);color:#fff;
  font-size:10px;font-weight:800;line-height:15px;padding:0 3px}

/* ── ① 结论大卡 ── */
.hero{border-radius:16px;padding:11px 10px;box-shadow:var(--sh);border:1px solid var(--line2)}
.hero.go{background:#f0faf4}.hero.hold{background:#fdf8f1}.hero.stop{background:#fdf3f4}
.hero .top{display:flex;align-items:center;gap:8px}
.hero .em{font-size:28px;line-height:1}
.hero h1{font-size:17px;font-weight:900;letter-spacing:.3px}
.hero .sub{font-size:11px;color:var(--tx2);margin-top:3px}
.hero p{font-size:12px;color:var(--tx2);margin-top:7px;line-height:1.7}
.mode{margin-top:7px;background:var(--org-bg);border-radius:10px;
  padding:6px 8px;font-size:11px;line-height:1.65}
.mode b{color:var(--org)}

/* ── 缓存角标（结论大卡顶部，v1.37.0）──
   与 web/index.html 同一口径：首屏用上次缓存渲染时结论照常显示，但必须让用户
   一眼看出"这不是本轮实时数据"。用暖黄（--org 系，与降级提示同一语义色）
   而不是装饰性浅灰；长期挂在卡上，所以不加描边/阴影以免刺眼。
   深色模式下 --org/--org-bg 有独立取值（见文件顶部 media query），不必另写。 */
.cachetag{display:inline-flex;align-items:center;gap:4px;margin-bottom:5px;
  background:var(--org-bg);color:var(--org);border-radius:8px;
  padding:3px 6px;font-size:11px;font-weight:800;letter-spacing:.02em}
.cachetag b{font-family:var(--mono);font-weight:800}

/* ── 情绪三格 / 指标格 ── */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}
.stat{background:var(--card);border:1px solid var(--line2);border-radius:13px;
  padding:7px 8px;box-shadow:var(--sh)}
.stat .t{font-size:11px;color:var(--tx3);font-weight:700}
.stat .v{font-size:17px;font-weight:900;margin-top:2px;letter-spacing:.2px}
.stat .s{font-size:10px;color:var(--tx3);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── 通用卡 ── */
.card{background:var(--card);border:1px solid var(--line2);border-radius:15px;
  padding:10px 11px;box-shadow:var(--sh);margin-top:7px}
.card .label{font-size:11px;font-weight:800;color:var(--org)}
.card .theme{font-size:17px;font-weight:900;margin-top:2px}
.card p{font-size:11px;color:var(--tx2);line-height:1.7;margin-top:4px}
.card .mini{font-size:11px;color:var(--tx3);margin-top:4px}
.card.tap:active{transform:scale(.99)}

/* 五信号列表 */
.sigrow{display:flex;align-items:flex-start;gap:6px;padding:6px 0;
  border-bottom:1px solid var(--line2)}
.sigrow:last-child{border-bottom:0}
.sigrow .dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:4px}
.sigrow .dot.pass{background:var(--red)}
.sigrow .dot.weak{background:var(--org)}
.sigrow .dot.fail{background:var(--grn)}
.sigrow .dot.pending,.sigrow .dot.unknown{background:var(--tx3)}
.sigrow .nm{font-size:12px;font-weight:800}
.sigrow .dt{font-size:11px;color:var(--tx3);line-height:1.6;margin-top:2px}

/* ── 候选 / 持仓卡 ── */
.pick,.hold{background:var(--card);border:1px solid var(--line2);border-radius:14px;
  padding:8px 10px;box-shadow:var(--sh);margin-bottom:6px}
.pick:active{transform:scale(.985)}
.pick .r1,.hold .r1{display:flex;align-items:center;gap:5px}
.pick .nm,.hold .nm{font-size:14px;font-weight:900}
.pick .cd{font-size:10px;color:var(--tx3);font-weight:600}
.pick .pct,.hold .pnl{margin-left:auto;font-size:15px;font-weight:900}
.pick .r2{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.pick .r3{font-size:11px;color:var(--tx2);margin-top:4px;line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hold .r2{display:flex;gap:8px;font-size:11px;color:var(--tx3);margin-top:4px}
.hold .act{font-size:11px;color:var(--tx2);margin-top:4px;line-height:1.6}
.hold .unwind{font-size:11px;color:var(--org);background:var(--org-bg);
  border-radius:8px;padding:4px 6px;margin-top:4px;line-height:1.65}
.tag{display:inline-block;font-size:10px;font-weight:800;border-radius:6px;
  padding:2px 4px;line-height:1.5}
.tag.red{background:var(--red-bg);color:var(--red)}
.tag.blu{background:var(--blu-bg);color:var(--blu)}
.tag.org{background:var(--org-bg);color:var(--org)}
.tag.grn{background:var(--grn-bg);color:var(--grn)}
.tag.gry{background:var(--sk);color:var(--tx2)}

.watchlist{list-style:none;margin-top:5px}
.watchlist li{font-size:11px;color:var(--tx2);line-height:1.7;padding-left:12px;
  position:relative;margin-top:3px}
.watchlist li::before{content:"·";position:absolute;left:5px;font-weight:900;color:var(--blu)}

.empty{font-size:12px;color:var(--tx3);text-align:center;padding:16px 7px;
  line-height:1.8}
footer{font-size:11px;color:var(--tx3);text-align:center;margin:13px 0 4px;line-height:1.8}

/* ── 底部抽屉 ── */
#mask{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:40;opacity:0;
  pointer-events:none;transition:opacity .22s}
#mask.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);
  border-radius:20px 20px 0 0;padding:5px 11px calc(15px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .26s cubic-bezier(.32,.72,.32,1);
  max-height:82vh;overflow:auto;box-shadow:0 -8px 40px rgba(0,0,0,.18)}
#sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 8px}
#sheet h3{font-size:17px;font-weight:900;display:flex;align-items:center;gap:5px}
#sheet .sect{margin-top:10px}
#sheet .sect .k{font-size:11px;font-weight:800;color:var(--tx3);margin-bottom:3px}
#sheet .sect .item{font-size:12px;line-height:1.75;color:var(--tx2);
  background:var(--sk);border-radius:10px;padding:7px 8px;margin-top:4px}
#sheet .sect .item b{color:var(--tx)}
#sheet .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}
#sheet .kv>div{background:var(--sk);border-radius:10px;padding:5px 7px}
#sheet .kv .k2{font-size:10px;color:var(--tx3);font-weight:700}
#sheet .kv .v2{font-size:13px;font-weight:900;margin-top:1px}

/* ── 加载态 ── */
#loading{text-align:center;padding:34px 13px;color:var(--tx2)}
#loading .big{font-size:33px;margin-bottom:8px}
#loading .bar{height:6px;background:var(--sk);border-radius:3px;overflow:hidden;
  margin:12px auto 0;max-width:260px}
#loading .bar>div{height:100%;width:0;background:var(--blu);border-radius:3px;
  transition:width .5s}
#err{display:none;margin:10px 0;background:var(--red-bg);color:var(--red);
  border-radius:12px;padding:8px 10px;font-size:12px;line-height:1.7}
.notice{background:var(--blu-bg);color:var(--blu);border-radius:10px;
  padding:6px 8px;font-size:11px;line-height:1.7;margin-top:7px}

/* ── 持仓/自选操作 ── */
.btnrow{display:flex;gap:6px;margin:3px 0 10px}
.btnmain{flex:1;background:var(--blu);color:#fff;border:0;border-radius:11px;
  padding:8px;font-size:13px;font-weight:800;font-family:inherit;min-height:44px}
.btnmain:active{opacity:.85}
.btnghost{flex:1;background:var(--card);color:var(--blu);border:1px solid var(--blu);
  border-radius:11px;padding:8px;font-size:13px;font-weight:800;font-family:inherit;min-height:44px}
.btnghost:active{opacity:.7}
.xbtn{flex:none;background:none;border:0;color:var(--tx3);font-size:17px;
  padding:0 3px;line-height:1;min-width:30px;min-height:30px}
.xbtn:active{color:var(--red)}
.fin{width:100%;background:var(--sk);border:1px solid var(--line);border-radius:10px;
  padding:7px 9px;font-size:13px;font-family:inherit;color:var(--tx);margin-top:3px}
.fin:focus{outline:none;border-color:var(--blu)}
/* 加自选搜索：名称/拼音关键词的候选列表（触摸友好，行高放大） */
.sugbox{margin-top:5px;border:1px solid var(--line);border-radius:10px;overflow:hidden;
  background:var(--card);display:none}
.sugbox.on{display:block}
.sugbox .row{display:flex;align-items:center;gap:5px;padding:8px 9px;font-size:13px;
  border-bottom:1px solid var(--line2)}
.sugbox .row:last-child{border-bottom:0}
.sugbox .row:active{background:var(--sk)}
.sugbox .row.dis{opacity:.5}
.sugbox .nm{font-weight:700}
.sugbox .nm b{color:var(--org)}
.sugbox .cd{font-size:11px;color:var(--tx3);font-family:var(--mono)}
.sugbox .bd{margin-left:auto;font-size:11px;color:var(--tx3)}
.sugbox .tag{font-size:11px;color:var(--grn);font-weight:800}
.sugbox .msg{padding:8px 9px;font-size:11px;color:var(--tx3);line-height:1.7}
.capitem{padding:4px 0;border-bottom:1px solid var(--line2);font-size:11px;line-height:1.6}
.capitem:last-child{border-bottom:0}
.capitem .k3{font-weight:800;margin-right:4px}
.capitem .v3{color:var(--tx2)}
.capitem .n3{font-size:11px;color:var(--tx3);margin-top:2px;line-height:1.6}
#toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 18px);
  background:rgba(20,24,32,.92);color:#fff;padding:6px 11px;border-radius:20px;
  font-size:12px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;
  max-width:80vw;text-align:center}
#toast.on{opacity:1}

/* ── 数据源提醒条（受限时可操作：打开东财验证 / 验证后重试） ── */
#srcBar{margin-bottom:7px}
.srcwarn{background:var(--org-bg);color:var(--org);border-radius:12px;
  padding:7px 9px;font-size:11px;line-height:1.65;border-left:4px solid var(--org)}
.srcwarn .n{font-size:11px;color:var(--tx3);margin-top:3px}
.srcwarnbtns{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.sbtn{flex:1;min-width:130px;background:var(--org);color:#fff;border:0;border-radius:9px;
  padding:7px 8px;font-size:11px;font-weight:800;font-family:inherit;min-height:40px}
.sbtn:active{opacity:.85}
.sbtn.ghost{background:transparent;color:var(--org);border:1px solid var(--org)}

/* ════════════════════════════════════════════════════════════════════
   设计层 v2 · 工业实用（与桌面端同一套）—— 只改外观，不动结构
   记忆点：暖纸面 + 等宽数字 + 发丝边框
   ════════════════════════════════════════════════════════════════════ */

/* 氛围：一层暖色径向铺底（移动端不加颗粒，省电） */
body{background-image:
  radial-gradient(46rem 26rem at 4% -10%, rgba(200,36,47,.06), transparent 62%),
  radial-gradient(40rem 24rem at 104% 0%, rgba(43,91,140,.05), transparent 58%);
  background-attachment:fixed}

/* 数字等宽：盘口数字不抖 */
.stat .v,#sheet .kv .v2,.hmeta,.tag b{font-variant-numeric:tabular-nums}

/* 表面：卡片暖纸底 + 发丝分隔 */
.card,.pick{background:var(--card)}
.tabbar{border-top:1px solid var(--line)}

/* 结论卡：色条 + 纸面，替掉糖果渐变 */
.hero{border-radius:var(--r-lg);box-shadow:var(--sh2)}
.hero.go{background:linear-gradient(180deg,#f5fbf7,#eff8f2)}
.hero.hold{background:linear-gradient(180deg,#fdfaf3,#faf4e6)}
.hero.stop{background:linear-gradient(180deg,#fdf4f4,#fbeaeb)}
.hero h1{letter-spacing:-.01em}

/* 详情抽屉：小标题加字距、指标格改暖纸面 */
#sheet .sect .k{letter-spacing:.03em}
#sheet .kv>div{background:var(--card);border:1px solid var(--line2)}
#sheet .sect .item{border-top:1px solid var(--line2);padding-top:4px}

/* 触控目标 ≥44px（删除小按钮除外，它是行内紧凑控件） */
.btnmain,.btnghost,.sbtn{min-height:44px}
.btnmain,.btnghost{border-radius:var(--r-md)}

/* 首屏一次上浮编排 + 降级动效 */
@keyframes mrise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
main{animation:mrise 640ms var(--ease) .08s both}
@media (prefers-reduced-motion:reduce){main{animation:none}*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div style="min-width:0">
    <div class="brand">野人体系</div>
    <div class="hmeta" id="hmeta">载入中…</div>
  </div>
  <button id="btnRefresh">⟳ 刷新</button>
</header>

<main>
  <div id="err"></div>
  <div id="srcBar"></div>
  <div id="loading">
    <div class="big">🐺</div>
    <div id="loadMsg">正在准备…</div>
    <div class="bar"><div id="loadBar"></div></div>
  </div>
  <div id="app" style="display:none">
    <section class="tab on" id="tab-today"></section>
    <section class="tab" id="tab-theme"></section>
    <section class="tab" id="tab-picks"></section>
    <section class="tab" id="tab-hold"></section>
  </div>
</main>

<nav class="tabbar" id="tabbar">
  <button class="on" data-tab="today"><span class="ic">📊</span>今日</button>
  <button data-tab="theme"><span class="ic">🎯</span>主线</button>
  <button data-tab="picks"><span class="ic">📋</span>选股<span class="dot" id="dotPicks" style="display:none">0</span></button>
  <button data-tab="hold"><span class="ic">💼</span>持仓<span class="dot" id="dotHold" style="display:none">0</span></button>
</nav>

<div id="mask" onclick="closeSheet()"></div>
<div id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div id="toast"></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// 数值格式化统一守住「非有限数」：NaN / Infinity / 非数字串一律 '—'。
// 原来只挡 isNaN，Infinity 会原样输出；而 pctTxt(NaN) 会拼出 "—%" 这种半截文本。
const num=(v,d=2)=>{ if(v==null||v===''||!isFinite(Number(v)))return'—'; return Number(v).toFixed(d); };
// 脏值过滤：任何 [object Object] / undefined / NaN 都不许渲染到界面上
// （用户实测踩过：items 对象数组被当字符串拼 → 一串 [object Object]）
const dirty=v=>{ if(v==null) return true;
  const s=String(v); return !s || s==='undefined' || s==='null' || s==='NaN'
    || s.includes('[object') || s.includes('NaN'); };
const safe=v=>dirty(v)?'':String(v);
const pctCls=v=>(Number(v)>0?'up':(Number(v)<0?'dn':'fl'));
const pctTxt=v=>{ if(v==null||!isFinite(Number(v)))return'—';
  return (Number(v)>=0?'+':'')+num(v,2)+'%'; };
let REPORT=null, POLL=null, CUR_TAB='today', SRCINFO=null;

/* ── Tab 切换 ── */
function switchTab(k){
  CUR_TAB=k;
  document.querySelectorAll('.tab').forEach(s=>s.classList.toggle('on',s.id==='tab-'+k));
  document.querySelectorAll('#tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.tab===k));
  window.scrollTo({top:0});
  try{ localStorage.setItem('yeren_tab',k); }catch(e){}
}
$('tabbar').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(b) switchTab(b.dataset.tab);
});

/* ── 数据 ── */
async function fetchReport(){
  const r=await fetch('/api/result?top=20&limit=260',{cache:'no-store'});
  if(r.status===204) return null;          // 首次使用（无内存也无磁盘底）→ 走扫描
  if(!r.ok) throw new Error('HTTP '+r.status);
  return await r.json();
}
async function fetchSources(){
  try{
    const r=await fetch('/api/sources',{cache:'no-store'});
    if(r.ok){ SRCINFO=await r.json(); renderSrc(); maybePromptEm(); }
  }catch(e){}
}
function srcVendor(api){
  const s=String(api||'').toLowerCase();
  if(s.includes('push2')||s.includes('eastmoney')||s.includes('ulist')||s.includes('clist')) return '东财';
  if(s.includes('sina')) return '新浪';
  if(s.includes('gtimg')||s.includes('tencent')) return '腾讯';
  if(s.includes('cls')) return '财联社';
  if(s.includes('kaipanhong')||s.includes('kph')) return '开盘红';
  if(s.includes('10jqka')) return '同花顺';
  return '未知源';
}

/* ══════════════════════════════════════════════════════════════════
   东财受限 → 引导用户去网页做滑块验证
   ──────────────────────────────────────────────────────────────────
   东财按「IP 信誉」风控：被标记的 IP 在**网页**上会弹滑块，程序侧只会
   被 RST —— 代码绕不过人工验证，只能把用户送到验证页。手机端以前只有
   一条静态提示（既打不开东财、验证完也没法重试），这里补成闭环：
     检测受限 → 弹窗申请打开东财网页 → 验证完点「我已验证，重试」清熔断
   ══════════════════════════════════════════════════════════════════ */
const EM_URL='https://quote.eastmoney.com/center';
const EM_PROMPT_GAP=60*60*1000;      // 同一轮受限最多问一次，1 小时内不重复打扰
let _srcReady=false, _emPromptScheduled=false;

/* 数据源状态：要分清两件事 ——
   any = 有任意源受限（该提示）；em = **东财**受限（才该引导去网页做滑块验证）。
   混成一个判断会漏：新浪受限而 push2 没冷却时，原来会一条提示都不显示。 */
function srcState(){
  const blocked=(SRCINFO&&SRCINFO.blocked)||[];
  const p2=(SRCINFO&&SRCINFO.push2)||{};
  const emApis=blocked.filter(b=>srcVendor(b.api)==='东财');
  const cooling=Number(p2.cooling_seconds||0)>0;
  const vendors=[...new Set(blocked.map(b=>srcVendor(b.api)))];
  return {any: blocked.length>0 || cooling,
          em: emApis.length>0 || cooling,
          emApis, p2, vendors,
          degraded: ((SRCINFO&&SRCINFO.health)||{}).degraded || [],
          who: emApis.length?'东财':(vendors.join('、')||'数据源')};
}

/* 打开外部页面：浏览器里开新标签；安卓外壳的 WebView 会拦下 location 跳转
   并交给系统浏览器（WebView 里做不了滑块）。window.open 在 WebView 里
   返回 null（未开多窗口支持），所以必须有 location.href 这条兜底。 */
function openEmPage(){
  let w=null;
  try{ w=window.open(EM_URL,'_blank','noopener'); }catch(e){}
  if(!w){ try{ location.href=EM_URL; }catch(e){} }
}

/* 验证完成后清掉熔断，并立刻重扫一遍把东财数据取回来
   （只清熔断不重扫的话，结果缓存还在 TTL 内，页面上看不到任何变化） */
async function retryAfterVerify(){
  const j=await srcCmd({action:'unblock'});
  if(j){ toast('已清除限速记录，正在重新扫描…'); silentRescan(); }
}

function renderSrc(){
  const el=$('srcBar'); if(!el) return;
  const st=srcState();
  const parts=[];
  if(st.any){
    // 东财受限才给"去验证"入口（别的源受限没有人工验证这回事）
    parts.push(`<div class="srcwarn">⚠️ <b>${esc(st.who)}接口暂时受限</b> —— 系统已自动切换备用源，结论不受影响
      ${st.em?`<div class="srcwarnbtns">
        <button class="sbtn" onclick="openEmPage()">打开东财网页（滑块验证）</button>
        <button class="sbtn ghost" onclick="retryAfterVerify()">我已验证，重试</button>
      </div>
      <div class="n">被标记的 IP 会在东财网页上弹滑块，程序绕不过；验证后点「重试」立即恢复
        · <span style="color:var(--blu);font-weight:800" onclick="openSrcSheet()">数据源详情</span></div>`
      :`<div class="n">稍后会自动恢复，也可以点右上角刷新重试
        · <span style="color:var(--blu);font-weight:800" onclick="openSrcSheet()">数据源详情</span></div>`}
    </div>`);
  }
  // 数据降级（抓取失败 → 回退到当日最后一份好数据）要如实说，别假装一切正常
  if(st.degraded.length){
    parts.push(`<div class="srcwarn" style="background:var(--blu-bg);color:var(--blu);border-left-color:var(--blu)">
      ℹ️ <b>部分数据降级</b>：${st.degraded.map(d=>esc(d.label||d.key)
        +(d.stale_seconds?`（${d.stale_seconds}秒前快照）`:'')).join('、')}
      <div class="n">已回退到当日最后一份好数据，或用备用源 —— 降级不等于结论错，可信度略降
        · <span style="font-weight:800" onclick="openSrcSheet()">详情</span></div>
    </div>`);
  }
  el.innerHTML=parts.join('');
}

/* 自动申请打开东财网页。
   触发条件收紧到「东财接口确实进了熔断名单」—— push2 冷却只说明自限速让过路，
   不等于要人工验证，拿它弹窗会变成骚扰（横幅照常显示，用户想验证随时点）。 */
function maybePromptEm(){
  if(!_srcReady) return;                 // 页面还没出内容，先别弹
  if(!srcState().emApis.length) return;
  let last=0;
  try{ last=Number(localStorage.getItem('yeren_em_prompt')||0)||0; }catch(e){}
  if(Date.now()-last < EM_PROMPT_GAP) return;
  try{ localStorage.setItem('yeren_em_prompt',String(Date.now())); }catch(e){}
  if(confirm('检测到东财接口暂时受限。\n\n是否现在打开东财网页完成滑块验证？\n（验证后回到本页点「我已验证，重试」即可恢复）')){
    openEmPage();
  }
}
/* 首屏渲染完成后再问 —— 刚进 App 就弹窗会打断「先看结论」 */
function _afterFirstRender(){
  _srcReady=true;
  if(_emPromptScheduled) return;
  _emPromptScheduled=true;
  setTimeout(maybePromptEm,2000);
}

/* ── 数据源抽屉：列出**所有源**的实时状态 + 东财恢复入口 ──
   状态与桌面端同一个后端出处（GET /api/sources 的 items/groups/summary），
   取自最近一次真实使用，不额外发探测请求。 */
const SRC_ST_COL={ok:'var(--grn)',degraded:'var(--org)',blocked:'var(--red)',
                  down:'var(--red)',disabled:'var(--tx3)',unused:'var(--tx3)'};
const SRC_ST_BG={ok:'var(--grn-bg)',degraded:'var(--org-bg)',blocked:'var(--red-bg)',
                 down:'var(--red-bg)',disabled:'var(--sk)',unused:'var(--sk)'};
const SRC_ST_ORDER=[['ok','正常'],['degraded','降级'],['blocked','受限'],
                    ['down','不通'],['disabled','未启用'],['unused','未使用']];
function srcBadge(k,txt){

        </span></div>`).join('')}</div>`).join('')}
    <div class="sect"><div class="k">东财被限速</div>
      <div class="item fl" style="font-size:12px">被标记的 IP 会在网页上弹滑块验证，程序绕不过。</div>
      <button class="btnmain" style="width:100%;margin-top:10px" onclick="openEmPage()">打开东财网页（滑块验证）</button>

async function srcCmd(payload){
  try{
    const r=await fetch('/api/sources',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const j=await r.json();
    if(j.error){ toast(j.error); return null; }
    if(j.msg) toast(j.msg);
    await fetchSources();          // 重新拉完整状态（含 push2 预算），横幅随之刷新
    return j;
  }catch(e){ toast('操作失败：'+e.message); return null; }
}
function loadCache(){
  try{ const c=localStorage.getItem('yeren_mobile');
    if(c){ REPORT=JSON.parse(c);
      const ts=localStorage.getItem('yeren_mobile_ts')||'';
      render(true,ts); const t=localStorage.getItem('yeren_tab'); if(t) switchTab(t);
      return true; } }catch(e){}
  return false;
}
function saveCache(){
  try{ localStorage.setItem('yeren_mobile',JSON.stringify(REPORT));
    localStorage.setItem('yeren_mobile_ts',new Date().toLocaleTimeString('zh-CN',
      {hour:'2-digit',minute:'2-digit'})); }catch(e){}
}
/* 主动刷新 vs 静默刷新的区别（用户实测踩过：点刷新页面完全不变）
   · 静默（每分钟 / 切回前台）→ 只重取结果，命中缓存就命中，不打扰；
   · 主动（点按钮 / 下拉）→ 用户要的是"最新"，必须先清结果缓存：
     `/api/result` 有 3 分钟内存缓存（RESULT_TTL=180s），不清的话点多少次
     都拿回同一份对象，render() 用同样数据重画 → 看起来"刷新不出来"。
   60 秒节流：下拉手势极易误触（在顶部往上滑就触发），不能每次都全量重扫。 */
let _lastManualAt=0;
const MANUAL_SCAN_GAP=60*1000;
function _btnIdle(){
  const b=$('btnRefresh'); if(b){ b.classList.remove('syncing'); b.textContent='⟳ 刷新'; }
}

async function refresh(manual){
  const btn=$('btnRefresh');
  if(manual){ btn.classList.add('syncing'); btn.textContent='⟳ 同步中'; }
  const wantScan = manual && (Date.now()-_lastManualAt > MANUAL_SCAN_GAP);
  if(wantScan){
    _lastManualAt=Date.now();
    try{ await fetch('/api/invalidate',{method:'POST',cache:'no-store'}); }catch(e){}
  }
  try{
    const [rep] = await Promise.all([fetchReport(), fetchSources()]);
    if(!rep){                        // 没有历史结果 → 显示进度并扫描
      $('loading').style.display=''; $('err').style.display='none';
      $('loadMsg').textContent=wantScan?'正在重新扫描…':'首次使用，正在扫描…';
      $('loadBar').style.width='2%';
      startAndPoll();
      return;
    }
    REPORT=rep; saveCache();
    $('loading').style.display='none'; $('err').style.display='none';
    render(!!rep.stale, rep.stale?_staleLabel(rep):'刚刚');
    // 主动刷新（或端出的是上次结果）→ 后台重扫，扫完自动换上新数据
    if(wantScan || rep.stale) silentRescan();
  }catch(e){
    if(!REPORT){
      $('loading').style.display='none'; $('err').style.display='block';
      $('err').innerHTML='取不到数据：'+esc(e.message)+'<br>下拉或点右上角刷新重试。';
    }else{
      $('hmeta').textContent='联网失败 · 显示上次结果';
    }
  }finally{
    // 后台还在重扫就保持"同步中"，扫完由 silentRescan 复位
    if(manual && !_rescanning) _btnIdle();
  }
}
async function startAndPoll(){
  if(POLL){ clearInterval(POLL); POLL=null; }   // 别叠出第二个轮询
  try{ await fetch('/api/start?top=20&limit=260',{cache:'no-store'}); }catch(e){}
  let n=0;
  POLL=setInterval(async()=>{
    n++;
    try{
      const st=await (await fetch('/api/status',{cache:'no-store'})).json();
      const p=Math.max(0,Math.min(99,Math.round(st.pct||0)));
      $('loadBar').style.width=p+'%';
      $('loadMsg').textContent=(st.progress||'扫描中')+(st.pct?'（'+p+'%）':'');
      if(st.done){ clearInterval(POLL); POLL=null; $('loadBar').style.width='100%';
        setTimeout(()=>refresh(false),300); }
      else if(st.error){ clearInterval(POLL); POLL=null; $('loadMsg').textContent='扫描出错：'+st.error; }
    }catch(e){}
    if(n>150){ clearInterval(POLL); POLL=null; $('loadMsg').textContent='等待超时，点刷新重试'; }
  },2000);
}

/* ── 过期缓存（上次结果）与后台静默重扫 ── */
let _rescanning=false, _rescanTimer=null;
function _staleLabel(d){
  const ts=d&&d.stale_ts;
  if(!ts) return '上次结果';
  try{ return new Date(ts*1000).toLocaleTimeString('zh-CN',
    {hour:'2-digit',minute:'2-digit'}); }catch(e){ return '上次结果'; }
}
function stopRescan(){
  if(_rescanTimer){ clearInterval(_rescanTimer); _rescanTimer=null; }
  _rescanning=false;
}
/* 先让用户看到上次结果，后台重扫，扫完自动刷新（不显示进度、不打断浏览） */
function silentRescan(){
  if(_rescanning) return;
  _rescanning=true;
  const b=$('btnRefresh'); if(b){ b.classList.add('syncing'); b.textContent='⟳ 扫描中'; }
  (async()=>{
    try{ await fetch('/api/start?top=20&limit=260',{cache:'no-store'}); }
    catch(e){ stopRescan(); _btnIdle(); return; }
    if(!_rescanning) return;          // 期间被 stopRescan 取消 → 别再挂轮询
    let n=0;
    _rescanTimer=setInterval(async()=>{
      n++;
      try{
        const st=await (await fetch('/api/status',{cache:'no-store'})).json();
        if(st.done){ stopRescan(); _btnIdle(); refresh(false); }
        else if(st.error||n>120){ stopRescan(); _btnIdle(); }
      }catch(e){ if(n>120){ stopRescan(); _btnIdle(); } }
    },3000);
  })();
}

/* ── 渲染 ── */
function render(fromCache,ts){
  const d=REPORT; if(!d||!d.meta) return;
  // 静默刷新每分钟会重画一次，别把用户的滚动位置弹走（桌面版也有同样的处理）
  const _y=window.scrollY||0;
  // 有数据就把加载态收掉 —— 缓存路径（loadCache）不经过 refresh()，
  // 之前忘了在这里隐藏，进 App 会一直顶着"正在准备…"半屏白（用户实测）
  $('loading').style.display='none';
  const m=d.meta, sen=d.sentiment||{}, vol=d.volume||{}, meter=d.meter||{},
        ml=d.mainline||{}, out=d.outlook||{}, pf=d.portfolio||{},
        fl=d.flow||{}, sec=d.sectors||{}, mm=sen.metrics||{}, mt=meter.metrics||{};
  $('hmeta').textContent=`v${m.version||'?'} · ${m.date||''}`+
    (m.session&&m.session.label?' · '+m.session.label:'')+
    (fromCache?(' · 上次结果 '+(ts||'')+'（后台刷新中）'):(' · 已更新 '+ts));

  /* ═══ Tab 1 · 今日 ═══ */
  // ★ 数据就绪闸门（与 web/index.html 同一口径，见那边的长注释）：
  //   首次启动时涨停/跌停/炸板三个池子还没拉回来，engine 侧会算出
  //   hurt_area=0、四条退潮信号全不触发 → can_trade=true → 这里就报
  //   「可以出手，但要挑龙头」；等池子回来再翻成「今天不要买」。
  //   用户看到的就是"一会能买一会不能买" —— 那不是抖动，是拿缺数据当成了市场结论。
  //   所以数据没齐时只能报"还没法判断"，正负都不给。
  //   判据用 === false：老缓存里没有 data_ready 字段时退回既有逻辑，不误判、不报错。
  const notReady=sen.data_ready===false;
  const notReadyReason=(sen.not_ready_reason||'').trim();
  // ★ 缓存角标（v1.37.0，与 web/index.html 同一口径）：
  //   首屏用上次缓存渲染时结论**照常显示**，但挂角标 + 数据时间戳，
  //   让用户分清"真偏热"和"缓存的偏热"——缓存的偏热是真数据算的，只是不是本轮实时。
  //   ★ 层级：data_source / data_ts 挂在**报告顶层**（d = REPORT），不在 sentiment 里 ——
  //     后端 core/pipeline.py:302-303 与 server.py:193-194/204-205/215-216 写的都是顶层。
  //     读成 sen.data_source 会永远是 undefined，角标整套静默失效。
  //   ★ 防御：data_source / data_ts 是后端新字段，老后端 / 降级响应里可能没有。
  //     缺失时一律按"实时"处理：不显示角标，**绝不报错**。用显式白名单而不是
  //     `!=='live'`，否则 undefined 会被当成缓存，给所有老后端挂假角标。
  //     白名单含 "stale"：server.py:208/219 跨日不给结论时写的就是它。
  const _src=d.data_source;
  const srcIsCache=_src==='cache'||_src==='disk';
  const cacheTs=(()=>{
    if(!srcIsCache) return '';
    const t=Number(d.data_ts);
    if(!isFinite(t)||t<=0) return '';
    try{
      return new Date(t*1000).toLocaleTimeString('zh-CN',
        {hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
    }catch(e){ return ''; }
  })();
  const cacheTag=srcIsCache
    ?`<div class="cachetag" title="本次结论用的是上次缓存数据，后台正在静默刷新，拿到新数据后会自动替换">📦 缓存${
        cacheTs?'数据 · <b>'+esc(cacheTs)+'</b>':''}</div>`
    :'';
  const canTrade=sen.can_trade&&vol.mode!=='dry';
  const frozen=sen.stage==='unknown';
  // ★ 等待今日数据态（v1.37.0）：报告自己声明「隔夜 / 缓存不可用」时（后端
  //   /api/result 给 204 + {"cached":false} 或 {"stale":true}，refresh() 把
  //   rep.stale 透传进来），按已定口径**不渲染隔夜结论**，改为等待态。
  //   为什么不能只靠 fromCache：fromCache 表达的是"这次是本地存的旧渲染"，
  //   而这里要拦的是"数据本身跨日失效" —— 后者即使拿到全新的 REPORT 也算隔夜。
  //   判据只看显式信号，undefined 一律放行（老后端不受影响）。
  //   ★ 三个信号各自独立、都要认：stale===true / cached===false /
  //     data_source==='stale'（server.py:208/219 跨日时同时写后两个）。
  //     少认一个，将来后端只改一处就会漏判，页面会把隔夜结论当今日的说。
  const waitToday=!!(d.stale===true||d.cached===false||_src==='stale');
  const cls=(notReady||waitToday)?'stop':(!canTrade?'stop':(frozen?'stop':((sen.stage==='climax'||sen.stage==='follow')?'go':'hold')));
  const em=(notReady||waitToday)?(waitToday?'⏳':'🚫'):(!canTrade?'🚫':(frozen?'🧊':(cls==='go'?'✅':'⚠️')));
  const title=(notReady||waitToday)
    ?(waitToday?'等待今日数据':'数据未就绪，暂不判断')
    :(!canTrade?'今天不要买'
    :(frozen?'暂无涨停信号 —— 空仓等启动'
    :(cls==='go'?'可以出手，但要挑龙头':'可以小仓位试水')));
  const reason=waitToday
    ?`${d.wait_reason||'缓存数据已隔夜，今日数据仍在获取中'} —— 数据齐了才判断冷热，现在不做任何结论。`
    :(notReady
    ?`${notReadyReason||'关键数据仍在获取中'} —— 数据齐了才判断冷热。`
    :(!canTrade?(sen.can_trade?(vol.advice||''):(sen.note||'情绪进入退潮期'))
    :`${sen.label||sen.stage||''}${vol.label?'，'+vol.label:''}${
        mt.seal_rate!=null?('，封板率 '+Math.round(mt.seal_rate*100)+'%'):''}。`));
  const mode=out.mode||{};
  const sp=meter.space||{};
  // M3 情绪周期（能不能出手，权威口径，经滞回稳定）与 E1 温度计（量化温度）
  // 是两套阶段口径（M3 与 E1 同词不同义）：用词相同（高潮/退潮）含义不同。
  // v1.25.2 起 E1 的「退潮」只可能来自 M3 稳定器确认（sentiment_meter 不再
  // 拿原始亏钱面积/温度骤降强置 ebb）。
  // ★ v1.39.0 更正：下面原本写「两把尺子在数据层面已统一，同屏不会再出现
  //   一句情绪高潮一句退潮」—— 这句是**错的**。实测 2026-10-15 仍然打架：
  //   当日沪指 -2.03%、跌 5122 家、跌停 22 家，M3 判「退潮」，E1 温度 57° 报
  //   「🌱 修复·启动」。根因是温度四项完全不含大盘涨跌与跌停家数。
  //   修法见 core/sentiment_meter._breadth_penalty（温度 57→39、档位 revive→ice）。
  //   手机端这条修复**自动生效**（读的是同一个后端字段），此处只更正注释并
  //   补渲染 market_note，让用户在手机上也能看到"为什么降分"。
  const hist=d.history||{};
  const histNote=(hist.days!=null&&hist.days<8&&!fromCache)
    ? `<div class="notice">历史归档正在补齐（已 ${hist.days} 天${

  let t1=`<section class="hero ${cls}">
    ${cacheTag}
    <div class="top"><div class="em">${em}</div>
      <div><h1>${esc(title)}</h1>

        <div class="sub">${waitToday?'隔夜数据已作废 · 后台正在静默获取今日数据，拿到后本卡自动更新'

  /* E5 低位承接方向：退潮期 + 存量博弈 + 机构净卖出 同时成立才出

  /* E6 停牌·补位推演：龙头停牌（零成交）→ 同题材谁在接棒。

  const sb=d.substitute||{};

            同题材今日涨停 <b>${h.theme_zt_today==null?'—':h.theme_zt_today}</b> 家${h.theme_zt_prev?`（上一交易日 ${h.theme_zt_prev} 家）`:''}</div>

  /* E7 逆势连板（产业逻辑候选）：退潮日照样连板 = 驱动不在情绪周期里。

  const ind=d.industry||{};
  if(ind.enabled){
    if(!ind.active){
      t1+=`<h2>逆势连板 · 本轮无</h2><div class="card">
        <div class="fl" style="font-size:12.5px">${esc(ind.reason||'')}</div></div>`;
    }else{
      t1+=`<h2>逆势连板 <span class="cnt">谁的连板不是情绪撑的</span></h2><div class="card">
        <div class="fl" style="font-size:12.5px">${esc(ind.summary||'')}</div>
        ${(ind.picks||[]).map(p=>`<div style="margin-top:10px;padding-top:9px;border-top:1px solid var(--line2)">
          <div style="display:flex;gap:7px;align-items:baseline;flex-wrap:wrap">
            <b style="font-size:14.5px">${esc(p.name)}</b>
            <span class="cnt">最高 ${p.max_boards==null?'—':p.max_boards} 板</span>
            ${p.sector?`<span class="cnt">${esc(p.sector)}</span>`:''}
            <span class="cnt">${p.still?'今天仍在涨停池':'今天已断板/停牌'}</span></div>
          <div class="fl" style="font-size:12.5px;margin-top:3px">
            跨过逆势日 ${(p.ebb_days||[]).length} 个（${esc((p.ebb_days||[]).join('、'))}）
            · ${p.mv_first==null?'首板市值未取得':'首板市值约 '+p.mv_first+' 亿'}</div>
          ${(p.flags||[]).map(f=>`<div class="dt" style="margin-top:3px">${esc(f)}</div>`).join('')}

        </div>`).join('')}
        <div class="fl" style="font-size:11.5px;color:var(--tx3);margin-top:8px">${esc(ind.note||'')}</div>
      </div>`;
    }
  }

  /* E8 题材播种（前置题材池）：事件→受益→标的，题材生命周期 + 独苗 + 重复启动。
     用户 10-13「打板要提前找题材，不然看谁封板打谁是乱玩」。备选池，不是买入信号。 */
  const sw8=d.sowing||{};
  if(sw8.enabled){
    if(!sw8.active){
      t1+=`<h2>题材播种 · 本轮无</h2><div class="card">
        <div class="fl" style="font-size:12.5px">${esc(sw8.reason||'')}</div></div>`;
    }else{
      const tc={新播种:'var(--red)',加固中:'var(--org)',持平:'var(--tx2)',减弱:'var(--blu)',熄火:'var(--tx3)'};
      t1+=`<h2>题材播种 <span class="cnt">明天该盯哪几条线</span></h2><div class="card">
        <div class="fl" style="font-size:12.5px">${esc(sw8.summary||'')}</div>
        ${(sw8.themes||[]).length?`<div style="margin-top:10px"><div class="mini">题材生命周期</div>

          ${(sw8.lonely||[]).map(x=>`<div style="margin-top:6px">

              <span class="cnt">${x.new_theme?'全新题材':'老树新芽'}</span></div>
            <div class="dt" style="margin-top:3px">${esc(x.why||'')}</div></div>`).join('')}</div>`:''}
        ${(sw8.restarts||[]).length?`<div style="margin-top:10px;padding-top:9px;border-top:1px solid var(--line2)">

          ${(sw8.restarts||[]).map(x=>`<div style="margin-top:6px">
            <div style="display:flex;gap:7px;align-items:baseline;flex-wrap:wrap">

              <span class="cnt">空 ${x.gap_days} 日</span>${x.drifted?`<span class="cnt">标签漂移</span>`:''}</div>
            <div class="dt" style="margin-top:3px">${esc(x.why||'')}</div></div>`).join('')}</div>`:''}
        <div class="fl" style="font-size:11.5px;color:var(--tx3);margin-top:8px">${esc(sw8.note||'')}</div>
      </div>`;
    }
  }
  t1+=`<footer>扫描 ${m.scanned||'—'} 只 · ${m.elapsed||'—'} 秒 · 归档 ${hist.days||'—'} 天<br>
    数据源：东财/腾讯/财联社/开盘红 ·
    <span style="color:var(--blu);font-weight:700" onclick="openSrcSheet()">数据源设置</span><br>
    纯本地工具，不构成投资建议</footer>`;
  $('tab-today').innerHTML=t1;

  /* ═══ Tab 2 · 主线 ═══ */
  let t2='';

      <div class="label">${esc(ml.label||'')}</div>

    const mr=(p.moneyflow||{}).main;

    t3+=`<div class="pick" onclick="openSheet(${i})">
      <div class="r1"><span class="nm">${esc(p.name||'')}</span>

/* ── 迷你K线：蜡烛 + MA5/10/20 + 成交量 + 点按读数 ──
   手机详情以前完全没有图 —— 而买点/止损全是拿 5 日线、10 日线说事的。
   触摸设备不套十字光标，改成"点一下，图上方的读数行跟着变"，更好按。 */
function _maOf(closes,n){
  const out=[];
  for(let i=0;i<closes.length;i++){
    if(i<n-1){ out.push(null); continue; }
    let s=0; for(let j=i-n+1;j<=i;j++) s+=closes[j];
    out.push(s/n);
  }
  return out;
}
function _limitThreshold(code){
  const num=String(code||'').slice(2);
  if(/^(300|301|688|689)/.test(num)) return 19.5;
  if(/^(43|83|87|88|92)/.test(num)) return 29.0;
  return 9.5;
}
function drawKmini(p){
  const el=$('kmini'); if(!el) return;
  const bars=(p.kline_tail||[]);
  if(bars.length<2){ el.innerHTML='<div class="fl" style="font-size:12px">无K线数据</div>'; return; }
  const n=bars.length, W=Math.max(el.clientWidth||340,260), H=168;
  const padL=38,padR=10,padT=12,padB=16,gap=7;
  const volH=34, priceH=H-padT-padB-volH-gap;
  const iw=W-padL-padR, priceB=padT+priceH, volT=priceB+gap, volB=volT+volH;
  const closes=bars.map(b=>b.close), highs=bars.map(b=>b.high),
        lows=bars.map(b=>b.low), vols=bars.map(b=>b.volume||0);
  const ma5=_maOf(closes,5), ma10=_maOf(closes,10), ma20=_maOf(closes,20);
  let mn=Math.min(...lows), mx=Math.max(...highs);
  [ma5,ma10,ma20].forEach(a=>a.forEach(v=>{ if(v!=null){ if(v<mn)mn=v; if(v>mx)mx=v; } }));
  const pad=(mx-mn)*0.06||0.1; mn-=pad; mx+=pad;
  const rg=(mx-mn)||1, maxVol=Math.max(...vols,1);
  const X=i=>padL+i*iw/(n-1), Yp=v=>priceB-(v-mn)/rg*priceH, Yv=v=>volB-v/maxVol*volH;
  const bw=Math.max(1.3,Math.min(5,iw/n*0.6));
  const th=_limitThreshold(p.code);
  const prevC=i=>i>0?closes[i-1]:bars[i].open;
  const colOf=i=>bars[i].close>=prevC(i)?'#d92d3f':'#0f9d58';
  let candle='',vb='',marks='';
  bars.forEach((b,i)=>{
    const x=X(i), c=colOf(i);
    candle+=`<line x1="${x.toFixed(1)}" y1="${Yp(b.high).toFixed(1)}" x2="${x.toFixed(1)}" y2="${Yp(b.low).toFixed(1)}" stroke="${c}" stroke-width="1"/>`;
    const y0=Yp(Math.max(b.open,b.close)), y1=Yp(Math.min(b.open,b.close));
    candle+=`<rect x="${(x-bw/2).toFixed(1)}" y="${y0.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,y1-y0).toFixed(1)}" fill="${c}"/>`;
    vb+=`<rect x="${(x-bw/2).toFixed(1)}" y="${Yv(vols[i]).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,volB-Yv(vols[i])).toFixed(1)}" fill="${c}" opacity=".5"/>`;
    const pc=prevC(i);
    if(i>0 && pc>0 && (b.close-pc)/pc*100>=th)
      marks+=`<circle cx="${x.toFixed(1)}" cy="${(Yp(b.high)-3.4).toFixed(1)}" r="1.7" fill="#d92d3f"/>`;
  });
  const maPath=arr=>{
    let d='',st=false;
    arr.forEach((v,i)=>{ if(v==null)return; d+=`${st?'L':'M'}${X(i).toFixed(1)},${Yp(v).toFixed(1)}`; st=true; });
    return d;
  };
  const last=bars[n-1], pc0=prevC(n-1);
  const lastPct=pc0>0?(last.close-pc0)/pc0*100:0;
  const lastCol=lastPct>=0?'#d92d3f':'#0f9d58';
  const yl=Yp(last.close);
  const xIdx=[0,Math.round((n-1)*.5),n-1].filter((v,i,a)=>a.indexOf(v)===i);
  el.innerHTML=`<div id="kread" class="fl" style="font-size:11.5px;margin-bottom:2px;line-height:1.5"></div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    ${[0,.5,1].map(t=>`<line x1="${padL}" y1="${(padT+priceH*t).toFixed(1)}" x2="${W-padR}" y2="${(padT+priceH*t).toFixed(1)}" stroke="#eef1f5"/>
      <text x="${padL-5}" y="${(padT+priceH*t+3.5).toFixed(1)}" font-size="8.5" fill="#9aa3b2" text-anchor="end">${(mx-rg*t).toFixed(2)}</text>`).join('')}
    <line x1="${padL}" y1="${volB}" x2="${W-padR}" y2="${volB}" stroke="#eef1f5"/>
    ${vb}${candle}
    <path d="${maPath(ma5)}" fill="none" stroke="#e0a01a" stroke-width="1"/>
    <path d="${maPath(ma10)}" fill="none" stroke="#2563d9" stroke-width="1"/>
    <path d="${maPath(ma20)}" fill="none" stroke="#8b5cf6" stroke-width="1"/>
    <line x1="${padL}" y1="${yl.toFixed(1)}" x2="${W-padR}" y2="${yl.toFixed(1)}" stroke="${lastCol}" stroke-width="1" stroke-dasharray="4 3" opacity=".8"/>
    <text x="${W-padR}" y="${(yl-4).toFixed(1)}" font-size="9" fill="${lastCol}" text-anchor="end" font-weight="800">${last.close.toFixed(2)}</text>
    ${marks}
    ${xIdx.map(i=>`<text x="${X(i).toFixed(1)}" y="${H-4}" font-size="8.5" fill="#9aa3b2" text-anchor="middle">${esc(String(bars[i].date||'').slice(5))}</text>`).join('')}
    <rect id="kminiHot" x="${padL}" y="${padT}" width="${iw}" height="${volB-padT}" fill="transparent"/>
  </svg>
  <div style="font-size:10.5px;display:flex;gap:8px;flex-wrap:wrap">
    <span style="color:#e0a01a;font-weight:800">MA5 ${ma5[n-1]==null?'—':ma5[n-1].toFixed(2)}</span>
    <span style="color:#2563d9;font-weight:800">MA10 ${ma10[n-1]==null?'—':ma10[n-1].toFixed(2)}</span>
    <span style="color:#8b5cf6;font-weight:800">MA20 ${ma20[n-1]==null?'—':ma20[n-1].toFixed(2)}</span>
    <span class="fl">红点=涨停日 · 点图看某天</span>
  </div>`;
  const read=$('kread'), svg=el.querySelector('svg'), hot=$('kminiHot');
  const show=i=>{
    i=Math.max(0,Math.min(n-1,i));
    const b=bars[i], pc=prevC(i), pct=pc>0?(b.close-pc)/pc*100:0;
    read.innerHTML=`<b>${esc(b.date)}</b> 开 ${num(b.open)} 高 ${num(b.high)} 低 ${num(b.low)}
      <b>收 ${num(b.close)}</b> <span class="${pct>=0?'up':'dn'}">${pct>=0?'+':''}${pct.toFixed(2)}%</span>
      量 ${num(b.volume/1e4,1)}万手`;
  };
  show(n-1);
  if(svg && hot){
    const pick=ev=>{
      const r=svg.getBoundingClientRect(); if(!r.width) return;
      const cx=(ev.touches?ev.touches[0].clientX:ev.clientX);
      show(Math.round(((cx-r.left)/r.width*W-padL)/(iw/(n-1))));
    };
    hot.addEventListener('touchstart',pick,{passive:true});
    hot.addEventListener('touchmove',pick,{passive:true});
    hot.addEventListener('mousemove',pick);
  }
}

function openSheet(i){

  const buy0=buys[0], blk0=blocks[0];
  const conc=buy0
    ? {c:'yes', ic:'✅', ti:`可以买 · ${buy0.name}`,
       bd:`${buy0.entry||''}${buy0.stop&&buy0.stop!=='—'?`；止损 ${buy0.stop}`:''}`}
    : (blk0 ? {c:'no', ic:'🚫', ti:`今天别买 · ${blk0.name}`, bd: blk0.entry||blk0.trigger||''}
            : {c:'watch', ic:'⏸', ti:'暂时没有买点', bd:'放进观察名单，等出信号再动手'});
  const CONCBG={yes:'#f0fbf5', no:'#fef4f5', watch:'#fefaf3'};
  const CONCLN={yes:'#0a6b3d', no:'#a41c2c', watch:'#9a5a06'};
  // 结论条已经引用了第一条禁买提示（今天别买）—— 当日提示里别再重复同一句
  const blocksLeft=(!buy0&&blk0)?blocks.slice(1):blocks;
  const kvg=(t,rows)=>`<div class="sect"><div class="k">${t}</div>

    <div class="sect"><div class="k">今天怎么做</div>

        <b style="color:${CONCLN[conc.c]}">${conc.ic} ${esc(conc.ti)}</b>
        <div style="margin-top:4px">${esc(conc.bd)}</div></div></div>

    ${buys.length>1?`<div class="sect"><div class="k">其他买点</div>${buys.slice(1).map(b=>`
      <div class="item"><b>${esc(b.name)}</b>${b.position?`（${esc(b.position)}）`:''}<br>
        ${esc(b.entry||'')}${b.stop&&b.stop!=='—'?`<br><span class="fl">止损：${esc(b.stop)}</span>`:''}</div>`).join('')}</div>`:''}
    ${blocksLeft.length?`<div class="sect"><div class="k">当日提示</div>${blocksLeft.map(b=>`
      <div class="item"><b>${esc(b.name)}</b>：${esc(b.entry||b.trigger||'')}</div>`).join('')}</div>`:''}

    ${sw.ok?`<div class="sect"><div class="k">波段 · ${esc(sw.stage_cn||'')}</div>
      <div class="item">${sw.verdict?`<div style="margin-bottom:7px;padding:7px 9px;border-radius:8px;background:${

      <div class="item">${esc(p.zt_reason)}</div></div>`:''}
  `;
  drawKmini(p);

function normCode(v){
  v=String(v||'').trim().toLowerCase().replace(/\s/g,'');
  if(/^(sh|sz|bj)\d{6}$/.test(v)) return v;
  if(/^\d{6}$/.test(v))
    return ((v[0]==='6')?'sh':((v[0]==='4'||v[0]==='8')?'bj':'sz'))+v;
  return v;
}

  // 名称/拼音搜索为主，代码照旧可输（输 6 位数字或 sh600519 会被就地识别）
  $('sheetBody').innerHTML=`<h3>加自选</h3>
    <div class="sect">
      <div class="k">股票名称 或 代码</div>
      <input class="fin" id="fQuery" placeholder="如 茅台 / gzmt / 600519"
             autocapitalize="off" autocomplete="off" oninput="onWlInput()"
             onkeydown="if(event.key==='Enter'){event.preventDefault();submitWatch();}">
      <div class="sugbox" id="fSug"></div>
      <button class="btnmain" style="width:100%;margin-top:14px" onclick="submitWatch()">加自选</button>
      <div class="fl" style="font-size:11px;margin-top:8px;text-align:center;line-height:1.7">
        输名称/拼音关键词搜（如 茅台 / gzmt），或直接输 6 位代码（如 600519）</div>
    </div>`;
  _sheetOpen();
}
// ── 加自选：名称搜索（代码仍可直接输） ──
let _wlT=null, _wlSeq=0, _wlRows=[], _wlQ='';
function wlClearSug(){ const el=$('fSug'); if(el){ el.classList.remove('on'); el.innerHTML=''; } }
function wlHi(name,q){
  const i=String(name).toLowerCase().indexOf(String(q||'').toLowerCase());
  if(i<0||!q) return esc(name);
  return esc(name.slice(0,i))+'<b>'+esc(name.slice(i,i+q.length))+'</b>'+esc(name.slice(i+q.length));
}
function wlInList(code){
  const wl=((REPORT&&REPORT.portfolio)||{}).watchlist||[];
  return wl.some(w=>w.code===code);
}
function renderWlSug(rows,q,note){
  const el=$('fSug'); if(!el) return;
  if(!rows.length){
    el.innerHTML=`<div class="msg">${note?esc(note):'未匹配到股票 —— 试试更短的关键词（如「茅台」「银行」），或直接输 6 位代码'}</div>`;
    el.classList.add('on'); return;
  }
  el.innerHTML=rows.map(r=>{
    const has=wlInList(r.code);
    return `<div class="row${has?' dis':''}" data-c="${esc(r.code)}" data-n="${esc(r.name)}">
      <span class="nm">${wlHi(r.name,q)}</span>
      <span class="cd">${esc(r.code)}</span>
      <span class="bd">${esc(r.board||'')}</span>
      ${has?'<span class="tag">已在自选</span>':''}</div>`;
  }).join('');
  el.classList.add('on');
  el.querySelectorAll('.row').forEach(r=>r.onclick=()=>{
    if(r.classList.contains('dis')){ toast('该股已在自选里了'); return; }
    _addWatch(r.dataset.c, r.dataset.n);
  });
}
async function wlSearch(q){
  const seq=++_wlSeq;
  try{
    const r=await fetch('/api/search?q='+encodeURIComponent(q)+'&limit=8',{cache:'no-store'});
    const j=await r.json();
    if(seq!==_wlSeq) return null;
    return j||{ok:true,results:[],source:'error',note:'搜索接口返回异常'};
  }catch(e){
    if(seq!==_wlSeq) return null;
    return {ok:false,results:[],source:'error',note:'搜索请求失败：'+e.message};
  }
}
function onWlInput(){
  const raw=($('fQuery').value||'').trim();
  clearTimeout(_wlT);
  if(!raw){ _wlRows=[]; wlClearSug(); return; }
  if(/^(sh|sz|bj)\d{6}$/.test(normCode(raw))){ _wlRows=[]; wlClearSug(); return; }
  _wlT=setTimeout(async ()=>{
    const j=await wlSearch(raw); if(!j) return;
    _wlRows=(j.results||[]); _wlQ=raw;
    renderWlSug(_wlRows,raw,j.note);
  },220);
}
async function _postPortfolio(body){
  const r=await fetch('/api/portfolio',{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  return await r.json();
}
async function submitHold(){
  const code=normCode($('fCode').value);
  if(!/^(sh|sz|bj)\d{6}$/.test(code)){ toast('代码格式不对（如 sh600519）'); return; }
  try{
    const j=await _postPortfolio({action:'add', code, name:($('fName').value||'').trim(),
      cost:parseFloat($('fCost').value)||0, shares:parseFloat($('fShares').value)||0,
      note:($('fNote').value||'').trim()});
    if(j.error){ toast(j.error); return; }
    if(j.portfolio){ REPORT.portfolio=j.portfolio; saveCache(); render(false,'刚刚'); }
    closeSheet(); toast('已记入持仓');
  }catch(e){ toast('保存失败：'+e.message); }
}
async function _addWatch(code, name){
  try{
    const j=await _postPortfolio({action:'watch_add', code, name:name||''});
    if(j.error){ toast(j.error); return; }
    if(j.portfolio){ REPORT.portfolio=j.portfolio; saveCache(); render(false,'刚刚'); }
    closeSheet(); toast('已加入自选');
  }catch(e){ toast('保存失败：'+e.message); }
}
async function submitWatch(){
  const raw=($('fQuery').value||'').trim();
  if(!raw){ toast('请输入股票名称关键词或代码'); return; }
  const code=normCode(raw);
  if(/^(sh|sz|bj)\d{6}$/.test(code)) return _addWatch(code, '');   // 代码模式：保持原方式
  const j=await wlSearch(raw);
  if(!j){ toast('搜索失败，请重试'); return; }
  const rows=(j.results||[]);
  _wlRows=rows; _wlQ=raw;
  if(!rows.length){
    renderWlSug([],raw,j.note);
    toast(j.note||'没匹配到股票 —— 试试更短的关键词，或直接输 6 位代码');
    return;
  }
  if(rows.length===1) return _addWatch(rows[0].code, rows[0].name);
  renderWlSug(rows,raw,j.note);           // 多条：列出来让用户点选
  toast('匹配到 '+rows.length+' 只，点一下选择');
}
async function delRow(code, kind){
  const label=kind==='hold'?'持仓':'自选';
  if(!confirm('从'+label+'里删除 '+code+'？')) return;
  try{
    const j=await _postPortfolio({action:kind==='hold'?'remove':'watch_remove', code});
    if(j.error){ toast(j.error); return; }
    if(j.portfolio){ REPORT.portfolio=j.portfolio; saveCache(); render(false,'刚刚'); }
    toast('已从'+label+'删除');
  }catch(e){ toast('删除失败：'+e.message); }
}

/* ── 手势 ── */
let ty=0;
document.addEventListener('touchstart',e=>{ if(window.scrollY<=0) ty=e.touches[0].clientY; },{passive:true});
document.addEventListener('touchend',e=>{
  if(window.scrollY<=0&&ty){
    const dy=(e.changedTouches[0].clientY-ty);
    if(dy>90) refresh(true);
  }
  ty=0;
},{passive:true});

/* ── 启动 ── */
$('btnRefresh').onclick=()=>refresh(true);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refresh(false); });
if(!loadCache()){
  startAndPoll();          // 首次：没有历史结果 → 直接扫
}else{
  // 有本地缓存：先出内容，紧接着与服务器核对一次 —— 服务器上有更新的一份就换上，
  // 端出来的是过期结果就自动重扫。否则要干等 60 秒的轮询才更新。
  refresh(false);
}
// 数据源状态独立于报告：缓存路径不经过 refresh()，这里也拉一次
// —— 受限要在首屏就提示并给出去验证的入口，而不是等 60 秒后的轮询
fetchSources();
setInterval(()=>{ if(!document.hidden) refresh(false); },60000);
</script>
