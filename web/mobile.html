<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f4f6f9">
<title>野人体系</title>
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --line:#e4e8ee; --line2:#eef1f5;
  --tx:#161a21; --tx2:#58616f; --tx3:#9aa3b2;
  --red:#d92d3f; --red-bg:#fdeef0;
  --grn:#0f9d58; --grn-bg:#e9f8f0;
  --org:#e07c1a; --org-bg:#fdf3e5;
  --blu:#2563d9; --blu-bg:#eaf1fd;
  --sk:#f0f2f5;
  --sh:0 1px 3px rgba(16,24,40,.06);
  --tabh:56px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12151a; --card:#1b1f27; --line:#2a3039; --line2:#232830;
    --tx:#e8ebf0; --tx2:#a3adbd; --tx3:#6b7484;
    --red:#ff5c67; --red-bg:#3a1e23; --grn:#2fbf71; --grn-bg:#16301f;
    --org:#f0932b; --org-bg:#3a2a14; --blu:#5b8def; --blu-bg:#182642;
    --sk:#232830;
  }
  .hero.go{background:#16301f!important}
  .hero.hold{background:#3a2a14!important}
  .hero.stop{background:#3a1e23!important}
  .mode{background:var(--org-bg)!important;border-color:transparent!important}
  .tabbar{background:#171b22!important}
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);
  font:15px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom))}
b,strong{font-weight:800}
.fl{color:var(--tx3)}.up{color:var(--red)}.dn{color:var(--grn)}

/* ── 顶栏 ── */
header{position:sticky;top:0;z-index:20;
  padding:calc(9px + env(safe-area-inset-top)) 16px 9px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line2);
  display:flex;align-items:center;gap:10px}
.brand{font-weight:900;font-size:16px;letter-spacing:.4px}
.hmeta{font-size:11.5px;color:var(--tx3);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#btnRefresh{margin-left:auto;border:1px solid var(--line);background:var(--card);
  color:var(--tx2);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:700;
  min-height:36px;display:flex;align-items:center;gap:5px;flex:none}
#btnRefresh:active{opacity:.6}
#btnRefresh.syncing{color:var(--blu);border-color:var(--blu)}

main{padding:12px 14px 10px;max-width:560px;margin:0 auto}
.tab{display:none}
.tab.on{display:block}
h2{font-size:13px;font-weight:800;color:var(--tx2);margin:16px 2px 8px;
  display:flex;align-items:baseline;gap:7px}
h2:first-child{margin-top:4px}
h2 .cnt{font-size:11.5px;font-weight:600;color:var(--tx3)}

/* ── 底部 Tab 栏 ── */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line2);
  padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;background:none;border:0;padding:7px 0 8px;color:var(--tx3);
  font-size:11px;font-weight:700;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:2px;min-height:var(--tabh)}
.tabbar button .ic{font-size:19px;line-height:1.15;filter:grayscale(1);opacity:.55}
.tabbar button.on{color:var(--blu)}
.tabbar button.on .ic{filter:none;opacity:1}
.tabbar .dot{position:absolute;transform:translate(15px,-2px);
  min-width:15px;height:15px;border-radius:8px;background:var(--red);color:#fff;
  font-size:9.5px;font-weight:800;line-height:15px;padding:0 3px}

/* ── ① 结论大卡 ── */
.hero{border-radius:16px;padding:18px 17px;box-shadow:var(--sh);border:1px solid var(--line2)}
.hero.go{background:#f0faf4}.hero.hold{background:#fdf8f1}.hero.stop{background:#fdf3f4}
.hero .top{display:flex;align-items:center;gap:12px}
.hero .em{font-size:34px;line-height:1}
.hero h1{font-size:21px;font-weight:900;letter-spacing:.3px}
.hero .sub{font-size:12.5px;color:var(--tx2);margin-top:3px}
.hero p{font-size:13px;color:var(--tx2);margin-top:10px;line-height:1.7}
.mode{margin-top:11px;background:var(--org-bg);border-radius:10px;
  padding:9px 12px;font-size:12.5px;line-height:1.65}
.mode b{color:var(--org)}

/* ── 情绪三格 / 指标格 ── */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:11px}
.stat{background:var(--card);border:1px solid var(--line2);border-radius:13px;
  padding:11px 12px;box-shadow:var(--sh)}
.stat .t{font-size:11px;color:var(--tx3);font-weight:700}
.stat .v{font-size:19px;font-weight:900;margin-top:2px;letter-spacing:.2px}
.stat .s{font-size:10.5px;color:var(--tx3);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── 通用卡 ── */
.card{background:var(--card);border:1px solid var(--line2);border-radius:15px;
  padding:14px 15px;box-shadow:var(--sh);margin-top:10px}
.card .label{font-size:12px;font-weight:800;color:var(--org)}
.card .theme{font-size:19px;font-weight:900;margin-top:2px}
.card p{font-size:12.5px;color:var(--tx2);line-height:1.7;margin-top:7px}
.card .mini{font-size:11px;color:var(--tx3);margin-top:6px}
.card.tap:active{transform:scale(.99)}

/* 五信号列表 */
.sigrow{display:flex;align-items:flex-start;gap:9px;padding:9px 0;
  border-bottom:1px solid var(--line2)}
.sigrow:last-child{border-bottom:0}
.sigrow .dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:6px}
.sigrow .dot.pass{background:var(--red)}
.sigrow .dot.weak{background:var(--org)}
.sigrow .dot.fail{background:var(--grn)}
.sigrow .dot.pending,.sigrow .dot.unknown{background:var(--tx3)}
.sigrow .nm{font-size:13px;font-weight:800}
.sigrow .dt{font-size:11.5px;color:var(--tx3);line-height:1.6;margin-top:2px}

/* ── 候选 / 持仓卡 ── */
.pick,.hold{background:var(--card);border:1px solid var(--line2);border-radius:14px;
  padding:12px 14px;box-shadow:var(--sh);margin-bottom:9px}
.pick:active{transform:scale(.985)}
.pick .r1,.hold .r1{display:flex;align-items:center;gap:8px}
.pick .nm,.hold .nm{font-size:16px;font-weight:900}
.pick .cd{font-size:10.5px;color:var(--tx3);font-weight:600}
.pick .pct,.hold .pnl{margin-left:auto;font-size:17px;font-weight:900}
.pick .r2{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.pick .r3{font-size:12px;color:var(--tx2);margin-top:7px;line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hold .r2{display:flex;gap:12px;font-size:11.5px;color:var(--tx3);margin-top:6px}
.hold .act{font-size:12px;color:var(--tx2);margin-top:7px;line-height:1.6}
.hold .unwind{font-size:11.5px;color:var(--org);background:var(--org-bg);
  border-radius:8px;padding:7px 9px;margin-top:7px;line-height:1.65}
.tag{display:inline-block;font-size:10.5px;font-weight:800;border-radius:6px;
  padding:2px 7px;line-height:1.5}
.tag.red{background:var(--red-bg);color:var(--red)}
.tag.blu{background:var(--blu-bg);color:var(--blu)}
.tag.org{background:var(--org-bg);color:var(--org)}
.tag.grn{background:var(--grn-bg);color:var(--grn)}
.tag.gry{background:var(--sk);color:var(--tx2)}

.watchlist{list-style:none;margin-top:8px}
.watchlist li{font-size:12.5px;color:var(--tx2);line-height:1.7;padding-left:16px;
  position:relative;margin-top:5px}
.watchlist li::before{content:"·";position:absolute;left:5px;font-weight:900;color:var(--blu)}

.empty{font-size:13px;color:var(--tx3);text-align:center;padding:26px 10px;
  line-height:1.8}
footer{font-size:11px;color:var(--tx3);text-align:center;margin:20px 0 6px;line-height:1.8}

/* ── 底部抽屉 ── */
#mask{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:40;opacity:0;
  pointer-events:none;transition:opacity .22s}
#mask.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);
  border-radius:20px 20px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .26s cubic-bezier(.32,.72,.32,1);
  max-height:82vh;overflow:auto;box-shadow:0 -8px 40px rgba(0,0,0,.18)}
#sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
#sheet h3{font-size:19px;font-weight:900;display:flex;align-items:center;gap:8px}
#sheet .sect{margin-top:14px}
#sheet .sect .k{font-size:11.5px;font-weight:800;color:var(--tx3);margin-bottom:5px}
#sheet .sect .item{font-size:13px;line-height:1.75;color:var(--tx2);
  background:var(--sk);border-radius:10px;padding:10px 12px;margin-top:6px}
#sheet .sect .item b{color:var(--tx)}
#sheet .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
#sheet .kv>div{background:var(--sk);border-radius:10px;padding:8px 10px}
#sheet .kv .k2{font-size:10.5px;color:var(--tx3);font-weight:700}
#sheet .kv .v2{font-size:15px;font-weight:900;margin-top:1px}

/* ── 加载态 ── */
#loading{text-align:center;padding:56px 20px;color:var(--tx2)}
#loading .big{font-size:40px;margin-bottom:12px}
#loading .bar{height:6px;background:var(--sk);border-radius:3px;overflow:hidden;
  margin:16px auto 0;max-width:260px}
#loading .bar>div{height:100%;width:0;background:var(--blu);border-radius:3px;
  transition:width .5s}
#err{display:none;margin:14px 0;background:var(--red-bg);color:var(--red);
  border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.7}
.notice{background:var(--blu-bg);color:var(--blu);border-radius:10px;
  padding:9px 12px;font-size:12px;line-height:1.7;margin-top:10px}

/* ── 持仓/自选操作 ── */
.btnrow{display:flex;gap:9px;margin:4px 0 14px}
.btnmain{flex:1;background:var(--blu);color:#fff;border:0;border-radius:11px;
  padding:12px;font-size:14px;font-weight:800;font-family:inherit;min-height:44px}
.btnmain:active{opacity:.85}
.btnghost{flex:1;background:var(--card);color:var(--blu);border:1px solid var(--blu);
  border-radius:11px;padding:12px;font-size:14px;font-weight:800;font-family:inherit;min-height:44px}
.btnghost:active{opacity:.7}
.xbtn{flex:none;background:none;border:0;color:var(--tx3);font-size:19px;
  padding:0 4px;line-height:1;min-width:30px;min-height:30px}
.xbtn:active{color:var(--red)}
.fin{width:100%;background:var(--sk);border:1px solid var(--line);border-radius:10px;
  padding:11px 13px;font-size:15px;font-family:inherit;color:var(--tx);margin-top:5px}
.fin:focus{outline:none;border-color:var(--blu)}
.capitem{padding:6px 0;border-bottom:1px solid var(--line2);font-size:12.5px;line-height:1.6}
.capitem:last-child{border-bottom:0}
.capitem .k3{font-weight:800;margin-right:6px}
.capitem .v3{color:var(--tx2)}
.capitem .n3{font-size:11px;color:var(--tx3);margin-top:2px;line-height:1.6}
#toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 18px);
  background:rgba(20,24,32,.92);color:#fff;padding:9px 18px;border-radius:20px;
  font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;
  max-width:80vw;text-align:center}
#toast.on{opacity:1}

/* ── 数据源提醒条（受限时可操作：打开东财验证 / 验证后重试） ── */
#srcBar{margin-bottom:10px}
.srcwarn{background:var(--org-bg);color:var(--org);border-radius:12px;
  padding:10px 13px;font-size:12.5px;line-height:1.65;border-left:4px solid var(--org)}
.srcwarn .n{font-size:11px;color:var(--tx3);margin-top:3px}
.srcwarnbtns{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.sbtn{flex:1;min-width:130px;background:var(--org);color:#fff;border:0;border-radius:9px;
  padding:10px 12px;font-size:12.5px;font-weight:800;font-family:inherit;min-height:40px}
.sbtn:active{opacity:.85}
.sbtn.ghost{background:transparent;color:var(--org);border:1px solid var(--org)}
</style>
</head>
<body>

<header>
  <div style="min-width:0">
    <div class="brand">野人体系</div>
    <div class="hmeta" id="hmeta">载入中…</div>
  </div>
  <button id="btnRefresh">⟳ 刷新</button>
</header>

<main>
  <div id="err"></div>
  <div id="srcBar"></div>
  <div id="loading">
    <div class="big">🐺</div>
    <div id="loadMsg">正在准备…</div>
    <div class="bar"><div id="loadBar"></div></div>
  </div>
  <div id="app" style="display:none">
    <section class="tab on" id="tab-today"></section>
    <section class="tab" id="tab-theme"></section>
    <section class="tab" id="tab-picks"></section>
    <section class="tab" id="tab-hold"></section>
  </div>
</main>

<nav class="tabbar" id="tabbar">
  <button class="on" data-tab="today"><span class="ic">📊</span>今日</button>
  <button data-tab="theme"><span class="ic">🎯</span>主线</button>
  <button data-tab="picks"><span class="ic">📋</span>选股<span class="dot" id="dotPicks" style="display:none">0</span></button>
  <button data-tab="hold"><span class="ic">💼</span>持仓<span class="dot" id="dotHold" style="display:none">0</span></button>
</nav>

<div id="mask" onclick="closeSheet()"></div>
<div id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div id="toast"></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// 数值格式化统一守住「非有限数」：NaN / Infinity / 非数字串一律 '—'。
// 原来只挡 isNaN，Infinity 会原样输出；而 pctTxt(NaN) 会拼出 "—%" 这种半截文本。
const num=(v,d=2)=>{ if(v==null||v===''||!isFinite(Number(v)))return'—'; return Number(v).toFixed(d); };
// 脏值过滤：任何 [object Object] / undefined / NaN 都不许渲染到界面上
// （用户实测踩过：items 对象数组被当字符串拼 → 一串 [object Object]）
const dirty=v=>{ if(v==null) return true;
  const s=String(v); return !s || s==='undefined' || s==='null' || s==='NaN'
    || s.includes('[object') || s.includes('NaN'); };
const safe=v=>dirty(v)?'':String(v);
const pctCls=v=>(Number(v)>0?'up':(Number(v)<0?'dn':'fl'));
const pctTxt=v=>{ if(v==null||!isFinite(Number(v)))return'—';
  return (Number(v)>=0?'+':'')+num(v,2)+'%'; };
let REPORT=null, POLL=null, CUR_TAB='today', SRCINFO=null;

/* ── Tab 切换 ── */
function switchTab(k){
  CUR_TAB=k;
  document.querySelectorAll('.tab').forEach(s=>s.classList.toggle('on',s.id==='tab-'+k));
  document.querySelectorAll('#tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.tab===k));
  window.scrollTo({top:0});
  try{ localStorage.setItem('yeren_tab',k); }catch(e){}
}
$('tabbar').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(b) switchTab(b.dataset.tab);
});

/* ── 数据 ── */
async function fetchReport(){
  const r=await fetch('/api/result?top=20&limit=260',{cache:'no-store'});
  if(r.status===204) return null;          // 首次使用（无内存也无磁盘底）→ 走扫描
  if(!r.ok) throw new Error('HTTP '+r.status);
  return await r.json();
}
async function fetchSources(){
  try{
    const r=await fetch('/api/sources',{cache:'no-store'});
    if(r.ok){ SRCINFO=await r.json(); renderSrc(); maybePromptEm(); }
  }catch(e){}
}
function srcVendor(api){
  const s=String(api||'').toLowerCase();
  if(s.includes('push2')||s.includes('eastmoney')||s.includes('ulist')||s.includes('clist')) return '东财';
  if(s.includes('sina')) return '新浪';
  if(s.includes('gtimg')||s.includes('tencent')) return '腾讯';
  if(s.includes('cls')) return '财联社';
  if(s.includes('kaipanhong')||s.includes('kph')) return '开盘红';
  if(s.includes('10jqka')) return '同花顺';
  return '未知源';
}

/* ══════════════════════════════════════════════════════════════════
   东财受限 → 引导用户去网页做滑块验证
   ──────────────────────────────────────────────────────────────────
   东财按「IP 信誉」风控：被标记的 IP 在**网页**上会弹滑块，程序侧只会
   被 RST —— 代码绕不过人工验证，只能把用户送到验证页。手机端以前只有
   一条静态提示（既打不开东财、验证完也没法重试），这里补成闭环：
     检测受限 → 弹窗申请打开东财网页 → 验证完点「我已验证，重试」清熔断
   ══════════════════════════════════════════════════════════════════ */
const EM_URL='https://quote.eastmoney.com/center';
const EM_PROMPT_GAP=60*60*1000;      // 同一轮受限最多问一次，1 小时内不重复打扰
let _srcReady=false, _emPromptScheduled=false;

/* 数据源状态：要分清两件事 ——
   any = 有任意源受限（该提示）；em = **东财**受限（才该引导去网页做滑块验证）。
   混成一个判断会漏：新浪受限而 push2 没冷却时，原来会一条提示都不显示。 */
function srcState(){
  const blocked=(SRCINFO&&SRCINFO.blocked)||[];
  const p2=(SRCINFO&&SRCINFO.push2)||{};
  const emApis=blocked.filter(b=>srcVendor(b.api)==='东财');
  const cooling=Number(p2.cooling_seconds||0)>0;
  const vendors=[...new Set(blocked.map(b=>srcVendor(b.api)))];
  return {any: blocked.length>0 || cooling,
          em: emApis.length>0 || cooling,
          emApis, p2, vendors,
          degraded: ((SRCINFO&&SRCINFO.health)||{}).degraded || [],
          who: emApis.length?'东财':(vendors.join('、')||'数据源')};
}

/* 打开外部页面：浏览器里开新标签；安卓外壳的 WebView 会拦下 location 跳转
   并交给系统浏览器（WebView 里做不了滑块）。window.open 在 WebView 里
   返回 null（未开多窗口支持），所以必须有 location.href 这条兜底。 */
function openEmPage(){
  let w=null;
  try{ w=window.open(EM_URL,'_blank','noopener'); }catch(e){}
  if(!w){ try{ location.href=EM_URL; }catch(e){} }
}

/* 验证完成后清掉熔断，并立刻重扫一遍把东财数据取回来
   （只清熔断不重扫的话，结果缓存还在 TTL 内，页面上看不到任何变化） */
async function retryAfterVerify(){
  const j=await srcCmd({action:'unblock'});
  if(j){ toast('已清除限速记录，正在重新扫描…'); silentRescan(); }
}

function renderSrc(){
  const el=$('srcBar'); if(!el) return;
  const st=srcState();
  const parts=[];
  if(st.any){
    // 东财受限才给"去验证"入口（别的源受限没有人工验证这回事）
    parts.push(`<div class="srcwarn">⚠️ <b>${esc(st.who)}接口暂时受限</b> —— 系统已自动切换备用源，结论不受影响
      ${st.em?`<div class="srcwarnbtns">
        <button class="sbtn" onclick="openEmPage()">打开东财网页（滑块验证）</button>
        <button class="sbtn ghost" onclick="retryAfterVerify()">我已验证，重试</button>
      </div>

/* 主动刷新 vs 静默刷新的区别（用户实测踩过：点刷新页面完全不变）
   · 静默（每分钟 / 切回前台）→ 只重取结果，命中缓存就命中，不打扰；
   · 主动（点按钮 / 下拉）→ 用户要的是"最新"，必须先清结果缓存：
     `/api/result` 有 3 分钟内存缓存（RESULT_TTL=180s），不清的话点多少次
     都拿回同一份对象，render() 用同样数据重画 → 看起来"刷新不出来"。
   60 秒节流：下拉手势极易误触（在顶部往上滑就触发），不能每次都全量重扫。 */
let _lastManualAt=0;
const MANUAL_SCAN_GAP=60*1000;
function _btnIdle(){
  const b=$('btnRefresh'); if(b){ b.classList.remove('syncing'); b.textContent='⟳ 刷新'; }
}

async function refresh(manual){
  const btn=$('btnRefresh');
  if(manual){ btn.classList.add('syncing'); btn.textContent='⟳ 同步中'; }
  const wantScan = manual && (Date.now()-_lastManualAt > MANUAL_SCAN_GAP);
  if(wantScan){
    _lastManualAt=Date.now();
    try{ await fetch('/api/invalidate',{method:'POST',cache:'no-store'}); }catch(e){}
  }
  try{
    const [rep] = await Promise.all([fetchReport(), fetchSources()]);
    if(!rep){                        // 没有历史结果 → 显示进度并扫描
      $('loading').style.display=''; $('err').style.display='none';
      $('loadMsg').textContent=wantScan?'正在重新扫描…':'首次使用，正在扫描…';
      $('loadBar').style.width='2%';
      startAndPoll();
      return;
    }
    REPORT=rep; saveCache();
    $('loading').style.display='none'; $('err').style.display='none';
    render(!!rep.stale, rep.stale?_staleLabel(rep):'刚刚');
    // 主动刷新（或端出的是上次结果）→ 后台重扫，扫完自动换上新数据
    if(wantScan || rep.stale) silentRescan();
  }catch(e){
    if(!REPORT){
      $('loading').style.display='none'; $('err').style.display='block';
      $('err').innerHTML='取不到数据：'+esc(e.message)+'<br>下拉或点右上角刷新重试。';
    }else{
      $('hmeta').textContent='联网失败 · 显示上次结果';
    }
  }finally{
    // 后台还在重扫就保持"同步中"，扫完由 silentRescan 复位
    if(manual && !_rescanning) _btnIdle();
  }
}
async function startAndPoll(){
  if(POLL){ clearInterval(POLL); POLL=null; }   // 别叠出第二个轮询
  try{ await fetch('/api/start?top=20&limit=260',{cache:'no-store'}); }catch(e){}
  let n=0;
  POLL=setInterval(async()=>{
    n++;
    try{
      const st=await (await fetch('/api/status',{cache:'no-store'})).json();
      const p=Math.max(0,Math.min(99,Math.round(st.pct||0)));
      $('loadBar').style.width=p+'%';
      $('loadMsg').textContent=(st.progress||'扫描中')+(st.pct?'（'+p+'%）':'');
      if(st.done){ clearInterval(POLL); POLL=null; $('loadBar').style.width='100%';
        setTimeout(()=>refresh(false),300); }
      else if(st.error){ clearInterval(POLL); POLL=null; $('loadMsg').textContent='扫描出错：'+st.error; }
    }catch(e){}
    if(n>150){ clearInterval(POLL); POLL=null; $('loadMsg').textContent='等待超时，点刷新重试'; }
  },2000);
}

/* ── 过期缓存（上次结果）与后台静默重扫 ── */
let _rescanning=false, _rescanTimer=null;
function _staleLabel(d){
  const ts=d&&d.stale_ts;
  if(!ts) return '上次结果';
  try{ return new Date(ts*1000).toLocaleTimeString('zh-CN',
    {hour:'2-digit',minute:'2-digit'}); }catch(e){ return '上次结果'; }
}
function stopRescan(){
  if(_rescanTimer){ clearInterval(_rescanTimer); _rescanTimer=null; }
  _rescanning=false;
}
/* 先让用户看到上次结果，后台重扫，扫完自动刷新（不显示进度、不打断浏览） */
function silentRescan(){
  if(_rescanning) return;
  _rescanning=true;
  const b=$('btnRefresh'); if(b){ b.classList.add('syncing'); b.textContent='⟳ 扫描中'; }
  (async()=>{
    try{ await fetch('/api/start?top=20&limit=260',{cache:'no-store'}); }
    catch(e){ stopRescan(); _btnIdle(); return; }
    if(!_rescanning) return;          // 期间被 stopRescan 取消 → 别再挂轮询
    let n=0;
    _rescanTimer=setInterval(async()=>{
      n++;
      try{
        const st=await (await fetch('/api/status',{cache:'no-store'})).json();
        if(st.done){ stopRescan(); _btnIdle(); refresh(false); }
        else if(st.error||n>120){ stopRescan(); _btnIdle(); }
      }catch(e){ if(n>120){ stopRescan(); _btnIdle(); } }
    },3000);
  })();
}

    t4+=`<h2>持仓 <span class="cnt">${holds.length} 只 · 总盈亏 ${
      pf.total_pnl_pct==null?'—':pctTxt(pf.total_pnl_pct)}</span></h2>`;
    t4+=`<div class="stats3">
      <div class="stat"><div class="t">总市值</div><div class="v" style="font-size:16px">${
        num((pf.total_mv||0)/1e4,1)}万</div><div class="s">成本 ${
        num((pf.total_cost||0)/1e4,1)}万</div></div>
      <div class="stat"><div class="t">总盈亏</div><div class="v ${(pf.total_pnl||0)>=0?'up':'dn'}" style="font-size:16px">${
        (pf.total_pnl||0)>=0?'+':''}${num((pf.total_pnl||0)/1e4,2)}万</div>
        <div class="s">${pf.total_pnl_pct==null?'—':pctTxt(pf.total_pnl_pct)}</div></div>
      <div class="stat"><div class="t">体检告警</div><div class="v" style="font-size:16px">${
        checks.length}</div><div class="s">${checks.length?'需要处理':'暂无'}</div></div>
    </div>`;
    // 光有告警条数没法处理 —— 把每条告警和动作列出来（原来只显示数字）
    if(checks.length){
      t4+=`<h2>体检告警 <span class="cnt">${checks.length} 项</span></h2>
        <div class="card">${checks.map(c=>`
          <div class="sigrow">
            <div class="dot" style="background:${
              c.level==='red'?'var(--red)':(c.level==='yellow'?'var(--org)':'var(--tx3)')}"></div>
            <div><div class="nm">${esc(c.item||'')}</div>
              ${c.action?`<div class="dt">${esc(c.action)}</div>`:''}</div>
          </div>`).join('')}</div>`;
    }
    holds.forEach(h=>{
      const s0=(h.signals||[])[0]||{};
      t4+=`<div class="hold">
        <div class="r1"><span class="nm">${esc(h.name||h.code)}</span>
          <span class="pnl ${pctCls(h.pnl_pct)}">${pctTxt(h.pnl_pct)}</span>
          <button class="xbtn" onclick="delRow('${esc(h.code)}','hold')" title="删除">×</button></div>
        <div class="r2"><span>成本 ${num(h.cost)}</span><span>现价 ${num(h.price)}</span>
          <span>${esc(h.verdict||'')}</span></div>
        ${s0.name?`<div class="act"><b>${esc(s0.name)}</b>：${esc(s0.action||s0.trigger||'')}</div>`:''}
        ${h.unwind?`<div class="unwind">${esc(h.unwind)}</div>`:''}
      </div>`;
    });
  }else{
    t4+='<div class="empty">还没有持仓记录<br>点上面「＋ 记持仓」录入，系统会用同一套卖出信号帮你盯</div>';
  }
  if(watch.length){
    t4+=`<h2>自选 <span class="cnt">${watch.length} 只</span></h2><div class="card">${
      watch.map(w=>`<div style="display:flex;gap:8px;align-items:center;
        padding:7px 0;border-bottom:1px solid var(--line2);font-size:13.5px">
        <b>${esc(w.name||w.code)}</b><span class="fl" style="font-size:11px">${esc(w.code||'')}</span>
        <span class="${pctCls(w.pct)}" style="margin-left:auto;font-weight:800">${pctTxt(w.pct)}</span>
        <button class="xbtn" onclick="delRow('${esc(w.code)}','watch')" title="删除">×</button>
      </div>`).join('')}</div>`;
  }
  const dh=$('dotHold');
  if(checks.length){ dh.style.display=''; dh.textContent=checks.length>99?'99+':checks.length; }
  else dh.style.display='none';
  $('tab-hold').innerHTML=t4;

  $('app').style.display='block';
  _afterFirstRender();      // 首屏出来了 → 这时才允许弹「要不要去东财验证」
  try{ window.scrollTo(0,_y); }catch(e){}
}

/* ── 迷你K线：蜡烛 + MA5/10/20 + 成交量 + 点按读数 ──
   手机详情以前完全没有图 —— 而买点/止损全是拿 5 日线、10 日线说事的。
   触摸设备不套十字光标，改成"点一下，图上方的读数行跟着变"，更好按。 */
function _maOf(closes,n){
  const out=[];
  for(let i=0;i<closes.length;i++){
    if(i<n-1){ out.push(null); continue; }
    let s=0; for(let j=i-n+1;j<=i;j++) s+=closes[j];
    out.push(s/n);
  }
  return out;
}
function _limitThreshold(code){
  const num=String(code||'').slice(2);
  if(/^(300|301|688|689)/.test(num)) return 19.5;
  if(/^(43|83|87|88|92)/.test(num)) return 29.0;
  return 9.5;
}
function drawKmini(p){
  const el=$('kmini'); if(!el) return;
  const bars=(p.kline_tail||[]);
  if(bars.length<2){ el.innerHTML='<div class="fl" style="font-size:12px">无K线数据</div>'; return; }
  const n=bars.length, W=Math.max(el.clientWidth||340,260), H=168;
  const padL=38,padR=10,padT=12,padB=16,gap=7;
  const volH=34, priceH=H-padT-padB-volH-gap;
  const iw=W-padL-padR, priceB=padT+priceH, volT=priceB+gap, volB=volT+volH;
  const closes=bars.map(b=>b.close), highs=bars.map(b=>b.high),
        lows=bars.map(b=>b.low), vols=bars.map(b=>b.volume||0);
  const ma5=_maOf(closes,5), ma10=_maOf(closes,10), ma20=_maOf(closes,20);
  let mn=Math.min(...lows), mx=Math.max(...highs);
  [ma5,ma10,ma20].forEach(a=>a.forEach(v=>{ if(v!=null){ if(v<mn)mn=v; if(v>mx)mx=v; } }));
  const pad=(mx-mn)*0.06||0.1; mn-=pad; mx+=pad;
  const rg=(mx-mn)||1, maxVol=Math.max(...vols,1);
  const X=i=>padL+i*iw/(n-1), Yp=v=>priceB-(v-mn)/rg*priceH, Yv=v=>volB-v/maxVol*volH;
  const bw=Math.max(1.3,Math.min(5,iw/n*0.6));
  const th=_limitThreshold(p.code);
  const prevC=i=>i>0?closes[i-1]:bars[i].open;
  const colOf=i=>bars[i].close>=prevC(i)?'#d92d3f':'#0f9d58';
  let candle='',vb='',marks='';
  bars.forEach((b,i)=>{
    const x=X(i), c=colOf(i);
    candle+=`<line x1="${x.toFixed(1)}" y1="${Yp(b.high).toFixed(1)}" x2="${x.toFixed(1)}" y2="${Yp(b.low).toFixed(1)}" stroke="${c}" stroke-width="1"/>`;
    const y0=Yp(Math.max(b.open,b.close)), y1=Yp(Math.min(b.open,b.close));
    candle+=`<rect x="${(x-bw/2).toFixed(1)}" y="${y0.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,y1-y0).toFixed(1)}" fill="${c}"/>`;
    vb+=`<rect x="${(x-bw/2).toFixed(1)}" y="${Yv(vols[i]).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,volB-Yv(vols[i])).toFixed(1)}" fill="${c}" opacity=".5"/>`;
    const pc=prevC(i);
    if(i>0 && pc>0 && (b.close-pc)/pc*100>=th)
      marks+=`<circle cx="${x.toFixed(1)}" cy="${(Yp(b.high)-3.4).toFixed(1)}" r="1.7" fill="#d92d3f"/>`;
  });
  const maPath=arr=>{
    let d='',st=false;
    arr.forEach((v,i)=>{ if(v==null)return; d+=`${st?'L':'M'}${X(i).toFixed(1)},${Yp(v).toFixed(1)}`; st=true; });
    return d;
  };
  const last=bars[n-1], pc0=prevC(n-1);
  const lastPct=pc0>0?(last.close-pc0)/pc0*100:0;
  const lastCol=lastPct>=0?'#d92d3f':'#0f9d58';
  const yl=Yp(last.close);
  const xIdx=[0,Math.round((n-1)*.5),n-1].filter((v,i,a)=>a.indexOf(v)===i);
  el.innerHTML=`<div id="kread" class="fl" style="font-size:11.5px;margin-bottom:2px;line-height:1.5"></div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    ${[0,.5,1].map(t=>`<line x1="${padL}" y1="${(padT+priceH*t).toFixed(1)}" x2="${W-padR}" y2="${(padT+priceH*t).toFixed(1)}" stroke="#eef1f5"/>
      <text x="${padL-5}" y="${(padT+priceH*t+3.5).toFixed(1)}" font-size="8.5" fill="#9aa3b2" text-anchor="end">${(mx-rg*t).toFixed(2)}</text>`).join('')}
    <line x1="${padL}" y1="${volB}" x2="${W-padR}" y2="${volB}" stroke="#eef1f5"/>
    ${vb}${candle}
    <path d="${maPath(ma5)}" fill="none" stroke="#e0a01a" stroke-width="1"/>
    <path d="${maPath(ma10)}" fill="none" stroke="#2563d9" stroke-width="1"/>
    <path d="${maPath(ma20)}" fill="none" stroke="#8b5cf6" stroke-width="1"/>
    <line x1="${padL}" y1="${yl.toFixed(1)}" x2="${W-padR}" y2="${yl.toFixed(1)}" stroke="${lastCol}" stroke-width="1" stroke-dasharray="4 3" opacity=".8"/>
    <text x="${W-padR}" y="${(yl-4).toFixed(1)}" font-size="9" fill="${lastCol}" text-anchor="end" font-weight="800">${last.close.toFixed(2)}</text>
    ${marks}
    ${xIdx.map(i=>`<text x="${X(i).toFixed(1)}" y="${H-4}" font-size="8.5" fill="#9aa3b2" text-anchor="middle">${esc(String(bars[i].date||'').slice(5))}</text>`).join('')}
    <rect id="kminiHot" x="${padL}" y="${padT}" width="${iw}" height="${volB-padT}" fill="transparent"/>
  </svg>
  <div style="font-size:10.5px;display:flex;gap:8px;flex-wrap:wrap">
    <span style="color:#e0a01a;font-weight:800">MA5 ${ma5[n-1]==null?'—':ma5[n-1].toFixed(2)}</span>
    <span style="color:#2563d9;font-weight:800">MA10 ${ma10[n-1]==null?'—':ma10[n-1].toFixed(2)}</span>
    <span style="color:#8b5cf6;font-weight:800">MA20 ${ma20[n-1]==null?'—':ma20[n-1].toFixed(2)}</span>
    <span class="fl">红点=涨停日 · 点图看某天</span>
  </div>`;
  const read=$('kread'), svg=el.querySelector('svg'), hot=$('kminiHot');
  const show=i=>{
    i=Math.max(0,Math.min(n-1,i));
    const b=bars[i], pc=prevC(i), pct=pc>0?(b.close-pc)/pc*100:0;
    read.innerHTML=`<b>${esc(b.date)}</b> 开 ${num(b.open)} 高 ${num(b.high)} 低 ${num(b.low)}
      <b>收 ${num(b.close)}</b> <span class="${pct>=0?'up':'dn'}">${pct>=0?'+':''}${pct.toFixed(2)}%</span>
      量 ${num(b.volume/1e4,1)}万手`;
  };
  show(n-1);
  if(svg && hot){
    const pick=ev=>{
      const r=svg.getBoundingClientRect(); if(!r.width) return;
      const cx=(ev.touches?ev.touches[0].clientX:ev.clientX);
      show(Math.round(((cx-r.left)/r.width*W-padL)/(iw/(n-1))));
    };
    hot.addEventListener('touchstart',pick,{passive:true});
    hot.addEventListener('touchmove',pick,{passive:true});
    hot.addEventListener('mousemove',pick);
  }
}

/* ── 抽屉：候选详情 ── */
function openSheet(i){
  const p=(window.__picks||[])[i]; if(!p) return;
  // 拆开「可执行买点」与「当日别买提示」—— 别把"涨停不追"当买点列出来
  const allB=p.buy_signals||[], sells=p.sell_signals||[], reasons=p.reasons||[];
  const buys=allB.filter(x=>x.kind!=='block'&&!x.blocked);
  const blocks=allB.filter(x=>x.kind==='block'||x.blocked);
  const g=p.graph_detail||{};
  const kv=[];
  kv.push(['位置',g.base_pos!=null?Math.round(g.base_pos*100)+'%':'—']);
  kv.push(['换手',p.turnover!=null?num(p.turnover,1)+'%':'—']);
  kv.push(['量能压缩',g.shrink!=null?Math.round(g.shrink*100)+'%':'—']);
  $('sheetBody').innerHTML=`
    <h3>${esc(p.name||'')} <span class="fl" style="font-size:12px;font-weight:600">${esc(p.code||'')}</span>
      <span class="${pctCls(p.pct)}" style="margin-left:auto;font-size:19px">${pctTxt(p.pct)}</span></h3>
    <div class="kv">${kv.map(([k,v])=>`<div><div class="k2">${k}</div><div class="v2">${v}</div></div>`).join('')}</div>
    <div class="sect"><div class="k">近30日走势</div><div id="kmini"></div></div>
    ${p.hot_rank?`<div class="sect"><div class="k">市场人气</div>
      <div class="item">同花顺人气榜第 <b>${p.hot_rank}</b> 名${p.hot_tag?` · ${esc(p.hot_tag)}`:''}</div></div>`:''}
    ${buys.length?`<div class="sect"><div class="k">买点</div>${buys.map(b=>`
      <div class="item"><b>${esc(b.name)}</b>${b.position?`（${esc(b.position)}）`:''}<br>
        ${esc(b.entry||'')}${b.stop?`<br><span class="fl">止损：${esc(b.stop)}</span>`:''}
        ${b.target?`<br><span class="fl">目标：${esc(b.target)}</span>`:''}</div>`).join('')}</div>`
      :`<div class="sect"><div class="k">买点</div><div class="item fl">当前没有可执行的买点 —— 等信号出现再动手</div></div>`}
    ${blocks.length?`<div class="sect"><div class="k">当日提示</div>${blocks.map(b=>`
      <div class="item"><b>${esc(b.name)}</b>：${esc(b.entry||b.trigger||'')}</div>`).join('')}</div>`:''}
    ${sells.length?`<div class="sect"><div class="k">卖出提醒</div>${sells.map(s=>`
      <div class="item"><b>${esc(s.name)}</b>：${esc(s.action||s.trigger||'')}</div>`).join('')}</div>`:''}
    ${reasons.length?`<div class="sect"><div class="k">为什么选它</div>
      <div class="item">${reasons.slice(0,5).map(r=>'· '+esc(r)).join('<br>')}</div></div>`:''}
    ${p.zt_reason?`<div class="sect"><div class="k">涨停原因</div>
      <div class="item">${esc(p.zt_reason)}</div></div>`:''}
  `;
  drawKmini(p);
  $('mask').classList.add('on'); $('sheet').classList.add('on');
}
function closeSheet(){ $('mask').classList.remove('on'); $('sheet').classList.remove('on'); }

/* ── 持仓 / 自选：增删 ── */
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),2200);
}
function normCode(v){
  v=String(v||'').trim().toLowerCase().replace(/\s/g,'');
  if(/^(sh|sz|bj)\d{6}$/.test(v)) return v;
  if(/^\d{6}$/.test(v))
    return ((v[0]==='6')?'sh':((v[0]==='4'||v[0]==='8')?'bj':'sz'))+v;
  return v;
}
function _sheetOpen(){ $('mask').classList.add('on'); $('sheet').classList.add('on'); }
function openHoldForm(){
  $('sheetBody').innerHTML=`<h3>记一笔持仓</h3>
    <div class="sect">
      <div class="k">股票代码（必填）</div>
      <input class="fin" id="fCode" placeholder="sh600519 / sz000001 / bj430047" autocapitalize="off" autocomplete="off">
      <div class="k" style="margin-top:10px">名称（可留空，自动取）</div>
      <input class="fin" id="fName" placeholder="贵州茅台">
      <div style="display:flex;gap:10px">
        <div style="flex:1"><div class="k" style="margin-top:10px">成本价</div>
          <input class="fin" id="fCost" type="number" step="0.01" inputmode="decimal" placeholder="0.00"></div>
        <div style="flex:1"><div class="k" style="margin-top:10px">股数</div>
          <input class="fin" id="fShares" type="number" step="100" inputmode="numeric" placeholder="100"></div>
      </div>
      <div class="k" style="margin-top:10px">备注（可留空）</div>
      <input class="fin" id="fNote" placeholder="买入理由 / 计划">
      <button class="btnmain" style="width:100%;margin-top:14px" onclick="submitHold()">保存</button>
      <div class="fl" style="font-size:11px;margin-top:8px;text-align:center">纯本地记录，只用来帮你盯卖点</div>
    </div>`;
  _sheetOpen();
}
function openWatchForm(){
  $('sheetBody').innerHTML=`<h3>加自选</h3>
    <div class="sect">
      <div class="k">股票代码（必填）</div>
      <input class="fin" id="fCode" placeholder="sh600519 / sz000001" autocapitalize="off" autocomplete="off">
      <div class="k" style="margin-top:10px">名称（可留空，自动取）</div>
      <input class="fin" id="fName" placeholder="贵州茅台">
      <button class="btnmain" style="width:100%;margin-top:14px" onclick="submitWatch()">保存</button>
    </div>`;
  _sheetOpen();
}
async function _postPortfolio(body){
  const r=await fetch('/api/portfolio',{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  return await r.json();
}
async function submitHold(){
  const code=normCode($('fCode').value);
  if(!/^(sh|sz|bj)\d{6}$/.test(code)){ toast('代码格式不对（如 sh600519）'); return; }
  try{
    const j=await _postPortfolio({action:'add', code, name:($('fName').value||'').trim(),
      cost:parseFloat($('fCost').value)||0, shares:parseFloat($('fShares').value)||0,
      note:($('fNote').value||'').trim()});
    if(j.error){ toast(j.error); return; }
    if(j.portfolio){ REPORT.portfolio=j.portfolio; saveCache(); render(false,'刚刚'); }
    closeSheet(); toast('已记入持仓');
  }catch(e){ toast('保存失败：'+e.message); }
}
async function submitWatch(){
  const code=normCode($('fCode').value);
  if(!/^(sh|sz|bj)\d{6}$/.test(code)){ toast('代码格式不对（如 sh600519）'); return; }
  try{
    const j=await _postPortfolio({action:'watch_add', code,
      name:($('fName').value||'').trim()});
    if(j.error){ toast(j.error); return; }
    if(j.portfolio){ REPORT.portfolio=j.portfolio; saveCache(); render(false,'刚刚'); }
    closeSheet(); toast('已加入自选');
  }catch(e){ toast('保存失败：'+e.message); }
}
async function delRow(code, kind){
  const label=kind==='hold'?'持仓':'自选';
  if(!confirm('从'+label+'里删除 '+code+'？')) return;
  try{
    const j=await _postPortfolio({action:kind==='hold'?'remove':'watch_remove', code});
    if(j.error){ toast(j.error); return; }
    if(j.portfolio){ REPORT.portfolio=j.portfolio; saveCache(); render(false,'刚刚'); }
    toast('已从'+label+'删除');
  }catch(e){ toast('删除失败：'+e.message); }
}

/* ── 手势 ── */
let ty=0;
document.addEventListener('touchstart',e=>{ if(window.scrollY<=0) ty=e.touches[0].clientY; },{passive:true});
document.addEventListener('touchend',e=>{
  if(window.scrollY<=0&&ty){
    const dy=(e.changedTouches[0].clientY-ty);
    if(dy>90) refresh(true);
  }
  ty=0;
},{passive:true});

/* ── 启动 ── */
$('btnRefresh').onclick=()=>refresh(true);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refresh(false); });
if(!loadCache()){
  startAndPoll();          // 首次：没有历史结果 → 直接扫
}else{
  // 有本地缓存：先出内容，紧接着与服务器核对一次 —— 服务器上有更新的一份就换上，
  // 端出来的是过期结果就自动重扫。否则要干等 60 秒的轮询才更新。
  refresh(false);
}
// 数据源状态独立于报告：缓存路径不经过 refresh()，这里也拉一次
// —— 受限要在首屏就提示并给出去验证的入口，而不是等 60 秒后的轮询
fetchSources();
setInterval(()=>{ if(!document.hidden) refresh(false); },60000);
</script>
